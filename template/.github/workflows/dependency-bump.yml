name: Dependency bump

# The daily scheduled dependency bump — the replacement for Dependabot:
# `cargo update` is the signal, the usual CI is the gate, and the merge
# lands lockfile + changelog in one commit.  See rust-template's
# reusable-dependency-bump.yml for the flow, and
# `[workspace.metadata.dependency-bump]` in Cargo.toml for holds.
on:
  schedule:
    # Daily, at a deliberately off-hour minute — GitHub delays or drops
    # top-of-hour cron runs under load.  Feel free to re-stagger this to
    # any minute/hour that suits the project; only the schedule's presence
    # is checked by compliance, not its timing.
    - cron: "17 6 * * *"
  # Manual catch-up: run the bump now instead of waiting for the schedule.
  workflow_dispatch:

permissions:
  # Push the bump branch and its commit.
  contents: write
  # Open and merge the bump PR.
  pull-requests: write
  # Dispatch CI against the bump branch, approve its gated run, and
  # dispatch publish.
  actions: write

jobs:
  bump:
    uses: LoganBarnett/rust-template/.github/workflows/reusable-dependency-bump.yml@main
