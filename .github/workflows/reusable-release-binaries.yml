name: Release binaries (reusable)

# Builds the release binaries for a tag and attaches them to that tag's GitHub
# release.  Invoked by a thin consumer wrapper that a publish run dispatches
# after it creates the tag (a tag pushed by GITHUB_TOKEN does not itself trigger
# downstream workflows, so the publish job dispatches this one explicitly — the
# same workflow_dispatch escape hatch reusable-dependabot-automerge.yml uses).
#
# Which crates ship a binary comes from each project's rust-template.json
# `workspaces.<crate>.release-binary` flags, so the same workflow serves a
# project with one binary or several, and one with none does nothing.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and attach binaries for (e.g. v0.17.0).
        required: true
        type: string

jobs:
  # Read the binary set from rust-template.json so the build matrix and the
  # whole workflow can short-circuit when a project ships no release binaries.
  crates:
    name: Resolve release binaries
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
      any: ${{ steps.read.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - id: read
        run: |
          list=$(jq --compact-output \
            '[.workspaces | to_entries[]
              | select(.value."release-binary") | .key]' \
            rust-template.json)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          if [ "$list" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  # Create the release the matrix uploads into, once, before any build starts so
  # the concurrent upload steps have a release to attach to.  Idempotent: a
  # re-run against an existing release is a no-op rather than a failure.
  release:
    name: Create release
    needs: crates
    if: needs.crates.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Create the release if absent
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One job per (target, crate).  Every target builds on a Linux runner: the
  # Linux artifacts natively (glibc and static musl, x86_64 plus GitHub's ARM
  # runner) and the macOS artifacts cross-compiled via zig
  # (mkDarwinCrossPackages), so a release never waits on a scarce macOS runner.
  # The target's `suffix` selects the package variant under the same
  # `.#packages.<system>` set.  fail-fast is off so one target's failure does
  # not cancel the rest, and each crate × target surfaces as its own job.
  build:
    name: ${{ matrix.crate }} (${{ matrix.target.label }})
    needs: [crates, release]
    if: needs.crates.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.crates.outputs.list) }}
        target:
          - { system: x86_64-linux, runner: ubuntu-latest, suffix: "", label: x86_64-linux-gnu }
          - { system: x86_64-linux, runner: ubuntu-latest, suffix: -musl, label: x86_64-linux-musl }
          - { system: aarch64-linux, runner: ubuntu-24.04-arm, suffix: "", label: aarch64-linux-gnu }
          - { system: aarch64-linux, runner: ubuntu-24.04-arm, suffix: -musl, label: aarch64-linux-musl }
          - { system: x86_64-linux, runner: ubuntu-latest, suffix: -x86_64-darwin, label: x86_64-darwin }
          - { system: x86_64-linux, runner: ubuntu-latest, suffix: -aarch64-darwin, label: aarch64-darwin }
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: write
      # Build provenance attestation is keyless: the job mints a GitHub OIDC
      # token (id-token) that Sigstore exchanges for a short-lived signing
      # certificate, then writes the resulting attestation to the repository's
      # attestation store (attestations).  As with the publish job, the caller's
      # workflow-level permissions must grant both, since a reusable job's token
      # cannot exceed what its caller holds.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # Install Nix; restore-only (`save-store: "false"`).  Each matrix
      # leg builds a full glibc/musl/zig-cross closure, and the matrix
      # spans both x86_64 and aarch64 Linux runners — writing would
      # churn the shared 10 GB cache (and the arch is already in the
      # key, so a save here could not help the other arch anyway).  It
      # still restores the toolchain a same-arch light job cached.  See
      # `.github/actions/setup-nix`.
      - uses: LoganBarnett/rust-template/.github/actions/setup-nix@main
        with:
          save-store: "false"

      # Build straight from the committed Cargo.lock.  Crane vendors the locked
      # dependencies through a fixed-output derivation, so the build needs no
      # network of its own.  Deliberately no `cargo generate-lockfile` here:
      # regenerating the lockfile re-resolves every git dependency to its latest
      # commit, silently bumping deps past breaking API changes so the build
      # then fails against source pinned to the older, locked revision.
      #
      # The target's `suffix` selects the package variant: "" for the native
      # glibc build, "-musl" for the static build, "-<arch>-darwin" for the
      # zig-cross macOS build.  `--print-out-paths` yields the store path; the
      # single binary under bin/ is whatever name the crate declares.
      - name: Build and package
        id: package
        run: |
          attr="${{ matrix.crate }}${{ matrix.target.suffix }}"
          out=$(nix build \
            ".#packages.${{ matrix.target.system }}.${attr}" \
            --no-link --print-out-paths)
          binary=$(ls "$out/bin")
          asset="${binary}-${{ inputs.tag }}-${{ matrix.target.label }}.tar.gz"
          # Run tar and sha256sum from the devShell so the archive is built with
          # the project's pinned coreutils rather than whatever the runner image
          # happens to ship.
          nix develop --command bash -c "
            tar --create --gzip --file '$asset' --directory '$out/bin' '$binary'
            sha256sum '$asset' > '$asset.sha256'
          "
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      # Record a keyless build-provenance attestation for the archive: a signed
      # SLSA statement binding it to this workflow run and the source commit,
      # verifiable with `gh attestation verify`.  Attest before upload so a
      # published asset always has matching provenance.  The .sha256 is a plain
      # integrity digest and needs none.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.asset }}

      - name: Upload to the release
        run: |
          gh release upload "$TAG" \
            "${{ steps.package.outputs.asset }}" \
            "${{ steps.package.outputs.asset }}.sha256" \
            --clobber
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
