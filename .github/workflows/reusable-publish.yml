name: Publish (reusable)

# Runs entirely inside `nix develop --command` so the toolchain,
# changelog-roller, and any other auxiliary tooling come from the
# consumer's devShell rather than ad-hoc per-step installs.  See
# `reusable-ci.yml` for the rationale.

on:
  workflow_call:
    inputs:
      changelog-file:
        type: string
        default: "CHANGELOG.org"

jobs:
  publish:
    name: Bump version and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for the crates.io trusted-publishing OIDC exchange:
      # GitHub mints an ID token, the auth action trades it for a
      # short-lived crates.io publish token, and the post-step
      # revokes that token when the job ends.  No long-lived secret
      # is involved.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: Swatinem/rust-cache@v2

      - name: Bump minor version
        id: bump
        run: |
          CURRENT=$(grep '^version = ' Cargo.toml | head --lines=1 | sed 's/version = "\(.*\)"/\1/')
          # `read -r` has no long-form equivalent — it is a bash
          # builtin whose option syntax accepts short flags only.
          # `-r` suppresses backslash-escape interpretation so a
          # version string containing a backslash would round-trip
          # intact rather than being silently transformed.
          IFS='.' read -r MAJOR MINOR _PATCH <<< "$CURRENT"
          NEW="${MAJOR}.$((MINOR + 1)).0"
          sed --in-place "s/^version = \"${CURRENT}\"/version = \"${NEW}\"/" Cargo.toml
          # The version bump above left Cargo.lock pinning the old version
          # of this workspace member.  Rewrite the lockfile so it agrees
          # with Cargo.toml before the subsequent commit and `cargo
          # publish`, both of which assume the two files are consistent.
          # `cargo update --workspace` touches only workspace members and
          # avoids the registry round-trip that `cargo fetch` would do.
          nix develop --command cargo update --workspace
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      - name: Roll changelog
        run: >
          nix develop --command
          changelog-roller roll
          --input-file ${{ inputs.changelog-file }}
          --version "v${{ steps.bump.outputs.version }}"
          --in-place

      - name: Commit and push release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock ${{ inputs.changelog-file }}
          git commit --message "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git push

      # The trusted-publishing OIDC exchange and `cargo publish` are
      # only useful when at least one workspace crate is actually
      # publishable.  When every crate has `publish = false` set, the
      # workflow still bumps versions, rolls the changelog, commits,
      # and tags — the release cadence stays intact even before
      # crates.io is wired up for any crate.
      #
      # `.publish` in `cargo metadata` is `null` for default-
      # publishable crates, `[]` for `publish = false`, and a list
      # like `["crates-io"]` when restricted to specific registries.
      # `null != []` and `[<x>, ...] != []` both evaluate to `true`;
      # only `publish = false` evaluates to `false`.
      - name: Determine whether any workspace crate is publishable
        id: publishable
        run: |
          publishable=$(nix develop --command cargo metadata \
            --format-version 1 --no-deps \
            | jq '[.packages[] | select(.publish != [])] | length > 0')
          echo "publishable=${publishable}" >> "$GITHUB_OUTPUT"

      # Runs on the runner's node, not under nix — the action just
      # does the GitHub-OIDC-to-crates.io-token HTTP exchange and
      # writes `token` as a step output.  The cargo step below
      # consumes it via $CARGO_REGISTRY_TOKEN; nix develop inherits
      # the parent environment so the variable crosses the boundary.
      # The exchanged token's scope is the union of every crate the
      # workflow holds a trust config for, so a single auth round
      # covers a multi-crate workspace publish.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.publishable.outputs.publishable == 'true'

      # `--workspace` publishes every member whose `publish` field is
      # not `false`, in dependency order, waiting for each to appear
      # in the registry index before starting the next.  Crates marked
      # `publish = false` are silently skipped, so a workspace mixing
      # publishable libraries with non-publishable binaries needs no
      # additional plumbing here.
      - name: Publish workspace to crates.io
        if: steps.publishable.outputs.publishable == 'true'
        run: nix develop --command cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # Annotated, not lightweight: `git describe` only walks annotated
      # tags by default, GitHub's Releases UI distinguishes them, and
      # tools that inspect tag metadata read the annotation payload.
      # Tagged unconditionally — even when the publish step above
      # skipped (`publish = false`), the release commit and version
      # are real; a consumer can `git checkout v0.X.Y && cargo
      # publish` from this tag to backfill the crates.io artifact
      # later if the flag flips to publishable.
      - name: Tag release
        run: |
          git tag --annotate "v${{ steps.bump.outputs.version }}" \
            --message "Release v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"
