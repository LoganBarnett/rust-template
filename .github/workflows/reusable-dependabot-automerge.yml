name: Dependabot auto-merge (reusable)

# Invoked by a consumer wrapper that triggers on `workflow_run`
# completing for the CI workflow.  All gating decisions happen here
# so the wrapper stays a one-liner.
#
# The flow runs in a single pass.  When CI passes on a Dependabot bump
# this fires: it injects a changelog entry on the bump's branch and
# squash-merges immediately, combining the bump and the changelog into
# one commit on main.  The squash-merge itself is the mergeability gate
# — GitHub lands it or rejects it — rather than a pre-check on the
# asynchronously-computed mergeStateStatus, which races.
#
# Dependabot cannot author a changelog entry, so it is exempt from the
# "Changelog entry required" CI job.  This flow supplies what that job
# would demand rather than skipping it: it composes the entry from the
# PR and runs the same `changelog-roller` — both the insert and the
# `check-additions` gate the CI job runs — inline.  Nothing is skipped;
# the build and test checks already passed on the bump and the code
# does not change.
#
# It deliberately does NOT push the changelog and wait for a second CI
# run.  A commit pushed with `GITHUB_TOKEN` does not trigger workflows
# (the no-cascade rule), so that second run would never fire and the
# PR would deadlock — which is exactly what an earlier two-pass version
# did once its author gate was fixed.  Publish is dispatched via
# `workflow_dispatch` (itself exempt from the no-cascade rule) once the
# merge lands.

on:
  workflow_call:
    inputs:
      changelog-file:
        type: string
        default: "CHANGELOG.org"
      publish-workflow:
        description: >-
          File name of the publish workflow to dispatch after merge.
          Set to an empty string to skip the dispatch step entirely
          (e.g. for repositories that have no publish step).
        type: string
        default: "publish.yml"

# Serialize per PR so two CI completions for the same branch cannot
# drive overlapping runs (e.g. a rebase landing while a merge is in
# flight).  `cancel-in-progress: false` so we never abort a run that
# is already past the gating checks and mid-merge.
concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Auto-merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Resolve PR from workflow_run head
        id: pr
        run: |
          NUMBER=$(gh pr list \
            --repo "$REPO" \
            --head "$HEAD_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -z "$NUMBER" ]; then
            echo "No open PR for branch $HEAD_BRANCH; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch PR metadata
        id: meta
        if: steps.pr.outputs.skip == 'false'
        run: |
          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json author,title,labels,url,headRefName \
            > pr.json
          AUTHOR=$(jq --raw-output '.author.login' pr.json)
          IS_BOT=$(jq --raw-output '.author.is_bot' pr.json)
          TITLE=$(jq --raw-output '.title' pr.json)
          URL=$(jq --raw-output '.url' pr.json)
          HEAD_REF=$(jq --raw-output '.headRefName' pr.json)
          IS_SECURITY=$(jq --raw-output \
            '[.labels[].name] | any(. == "security")' pr.json)
          {
            echo "author=$AUTHOR"
            echo "is_bot=$IS_BOT"
            echo "title=$TITLE"
            echo "url=$URL"
            echo "head_ref=$HEAD_REF"
            echo "is_security=$IS_SECURITY"
          } >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate on author and file list
        id: gate
        if: steps.pr.outputs.skip == 'false'
        run: |
          # `gh` spells the Dependabot GitHub App author `app/dependabot`,
          # whereas the raw API and older `gh` releases use
          # `dependabot[bot]`.  Accept either spelling, and require the
          # bot flag so a human login that happens to collide cannot slip
          # through — rather than pinning a single, drift-prone string.
          if [ "$IS_BOT" != "true" ] || \
             { [ "$AUTHOR" != "dependabot[bot]" ] && \
               [ "$AUTHOR" != "app/dependabot" ]; }; then
            echo "PR author is $AUTHOR (is_bot=$IS_BOT), not Dependabot;" \
              "skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only)
          echo "$FILES"
          # CHANGELOG.org is allowed because this workflow adds it
          # itself.  Anything outside this set means a human touched the
          # PR and we should stay out of it.
          UNEXPECTED=$(echo "$FILES" | grep --invert-match \
            --regexp='^Cargo\.\(toml\|lock\)$' \
            --regexp='^\.github/workflows/.*\.yml$' \
            --regexp="^${CHANGELOG_FILE//./\\.}\$" \
            || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::warning::PR touches unexpected files — skipping"
            echo "$UNEXPECTED"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No mergeability pre-check here.  mergeStateStatus is computed
          # asynchronously, so polling it and timing out is a race that
          # drops still-mergeable PRs.  The squash-merge below is the gate
          # instead: it succeeds or fails on GitHub's own verdict, and its
          # retry absorbs the brief "mergeability still computing" window.
          # CI success is already established by the workflow_run trigger
          # that fired this run.
          # Idempotency: a re-fire after a partial run may already carry
          # the changelog entry, so record whether it still needs adding.
          CHANGELOG_RE=${CHANGELOG_FILE//./\\.}
          if echo "$FILES" | grep --quiet --line-regexp "$CHANGELOG_RE"; then
            echo "has_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changelog=false" >> "$GITHUB_OUTPUT"
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          AUTHOR: ${{ steps.meta.outputs.author }}
          IS_BOT: ${{ steps.meta.outputs.is_bot }}
          CHANGELOG_FILE: ${{ inputs.changelog-file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Inject the changelog entry on the PR branch ---

      - uses: actions/checkout@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          ref: ${{ steps.meta.outputs.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history so the `check-additions` gate below can diff the
          # entry against `origin/main`, exactly as the CI job does.
          fetch-depth: 0

      # Install Nix + restore/save the `/nix` store cache.  See
      # `.github/actions/setup-nix` for the rationale.
      - uses: LoganBarnett/rust-template/.github/actions/setup-nix@main
        if: steps.gate.outputs.proceed == 'true'

      - name: Append changelog entry and push to PR branch
        if: >
          steps.gate.outputs.proceed == 'true' &&
          steps.gate.outputs.has_changelog == 'false'
        run: |
          if [ "$IS_SECURITY" = "true" ]; then
            HEADING=Security
          else
            HEADING=Maintenance
          fi
          BODY="${TITLE} (${URL})"
          # Compose the entry from the PR and insert it with the same
          # changelog-roller the CI check uses.  Dependabot is exempt
          # from the "Changelog entry required" job, so this supplies
          # what that job would demand — it does not bypass it.
          nix develop .#ci --command changelog-roller insert-item \
            --input-file "$CHANGELOG_FILE" \
            --heading "$HEADING" \
            --body "$BODY" \
            --in-place
          # Run the CI job's own gate against the result, so the
          # changelog check is genuinely enforced here rather than
          # merely satisfied by construction.
          nix develop .#ci --command changelog-roller check-additions \
            --input-file "$CHANGELOG_FILE" \
            --base origin/main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CHANGELOG_FILE"
          git commit --message "changelog for #${PR_NUMBER}"
          git push origin "HEAD:$HEAD_REF"
        env:
          CHANGELOG_FILE: ${{ inputs.changelog-file }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          TITLE: ${{ steps.meta.outputs.title }}
          URL: ${{ steps.meta.outputs.url }}
          IS_SECURITY: ${{ steps.meta.outputs.is_security }}
          HEAD_REF: ${{ steps.meta.outputs.head_ref }}

      # --- Squash-merge and dispatch publish ---

      # The squash-merge is the gate.  We do not pre-check mergeability
      # (see the gate step): GitHub decides here.  Success means the bump
      # and its changelog land as one commit on main.  A failure is
      # usually the brief window where GitHub is still computing
      # mergeability after the changelog push, so retry patiently; a
      # failure that persists is a genuine conflict, and we leave the PR
      # for a human rather than force it.
      - name: Squash-merge the PR
        id: merge
        if: steps.gate.outputs.proceed == 'true'
        run: |
          merged=false
          n=0
          while [ $n -lt 12 ]; do
            if gh pr merge "$PR_NUMBER" \
                --repo "$REPO" \
                --squash \
                --delete-branch; then
              merged=true
              break
            fi
            # The merge may have landed even if branch deletion errored;
            # trust the PR state over the command's exit code.
            if [ "$(gh pr view "$PR_NUMBER" --repo "$REPO" \
                --json state --jq '.state')" = "MERGED" ]; then
              merged=true
              break
            fi
            n=$((n + 1))
            sleep 15
          done
          if [ "$merged" != "true" ]; then
            echo "::warning::squash-merge did not succeed after retries;" \
              "leaving the PR for a human (likely a genuine conflict)."
          fi
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch publish
        if: >
          steps.merge.outputs.merged == 'true' &&
          inputs.publish-workflow != ''
        run: gh workflow run "$WORKFLOW" --repo "$REPO" --ref main
        env:
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ inputs.publish-workflow }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
