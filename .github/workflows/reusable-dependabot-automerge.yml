name: Dependabot auto-merge (reusable)

# Invoked by a consumer wrapper that fires on `workflow_run` completing for
# the CI workflow.  All gating lives here so the wrapper stays a one-liner.
#
# This is a serial, single-flight queue over Dependabot's open bumps, built
# to land them cleanly under branch protection that requires the CI checks to
# pass on the merged commit.  The core problem it solves: the changelog entry
# must ride the same commit the checks run against, but committing it and
# merging in one pass moves the head out from under the checks that passed —
# and a GITHUB_TOKEN push cannot re-run them (the no-cascade rule).  So the
# flow runs two passes over each bump:
#
#   Pass 1 — CI has passed on the raw bump and it carries no changelog yet:
#     compose the entry, commit it to the bump's branch, and re-dispatch CI
#     via `workflow_dispatch` (which IS exempt from no-cascade) so the
#     required checks run against the changelog-bearing commit.
#   Pass 2 — CI has passed on that changelog-bearing commit: squash-merge it.
#     The merged head is exactly what the checks validated.
#
# The two passes are told apart by whether the changelog file is already in
# the PR's diff (the allowlist action's `has-changelog` output).
#
# Supporting machinery, all aimed at not stranding a bump:
#   - Single flight.  The concurrency group is a constant, so at most one
#     bump is in flight; two merges cannot race and leave each other stale.
#   - Rebase first.  A bump is advanced only while up to date with the base;
#     a behind bump is nudged and left for its re-run.  The changelog is
#     committed only once the bump is up to date, so the brief window in which
#     its branch is "edited" (and thus un-rebaseable by Dependabot) is short.
#   - Self-heal.  A branch carrying the changelog commit is disowned by
#     Dependabot (it will not rebase a branch edited by someone else); if such
#     a branch falls behind, it is `@dependabot recreate`d, which rebuilds it
#     from scratch and discards the stray commit.
#   - Hold label.  A bump whose CI fails is labeled and skipped, so a genuine
#     breaking upgrade does not wedge the head of the queue; a human removes
#     the label once the code is fixed.
#   - Advance.  After each merge or park, the oldest still-behind bump is
#     nudged, walking the queue one bump at a time.
#
# The squash-merge is the mergeability gate; "behind the base" is read from
# the compare API's `behind_by` (derived synchronously from the commit graph,
# unlike the asynchronously-computed mergeStateStatus, which races).  Publish
# is dispatched via `workflow_dispatch` after the merge, for the same
# no-cascade reason the CI re-dispatch exists.

on:
  workflow_call:
    inputs:
      changelog-file:
        type: string
        default: "CHANGELOG.org"
      ci-workflow:
        description: >-
          File name of the CI workflow to re-dispatch after committing the
          changelog, so the required checks run against the changelog commit.
        type: string
        default: "ci.yml"
      publish-workflow:
        description: >-
          File name of the publish workflow to dispatch after merge.  Set to
          an empty string to skip the dispatch entirely (e.g. a repository
          with no publish step).
        type: string
        default: "publish.yml"
      hold-label:
        description: >-
          Label applied to a Dependabot bump whose CI has failed, to park it
          out of the queue until a human removes it.  The queue skips any bump
          carrying it.
        type: string
        default: "dependabot-hold"

jobs:
  automerge:
    name: Auto-merge
    # The event/conclusion gate lives here, on the reusable's job, rather than
    # in the consumer wrapper, so a spawn's wrapper is a static pass-through:
    # changes to which events and conclusions drive the flow ride @main and
    # never require a spawn to re-sync.  The reusable inherits the caller's
    # `github` context, so `github.event.workflow_run` resolves here.  Fire on
    # the CI run a bump's `pull_request` produced (pass 1) and the run its
    # changelog re-dispatch produced (pass 2, a `workflow_dispatch` run), on
    # both success and failure — a failure parks the bump.  Pushes to main and
    # other events are ignored.
    if: >
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    # Repo-wide single flight, at the job level rather than the workflow level
    # so an invocation the `if` skips never claims the group — a no-op run for
    # an ignored event cannot displace a real merge waiting in the single
    # pending slot.  The group is a constant, not keyed by branch, so at most
    # one bump is in flight and two merges cannot race and strand each other.
    # `cancel-in-progress: false` so a run already mid-merge is never aborted.
    concurrency:
      group: dependabot-automerge
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Dispatch the CI re-run and the publish workflow.
      actions: write
      # Create and apply the hold label.
      issues: write
    steps:
      - name: Resolve PR from workflow_run head
        id: pr
        run: |
          NUMBER=$(gh pr list \
            --repo "$REPO" \
            --head "$HEAD_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -z "$NUMBER" ]; then
            echo "No open PR for branch $HEAD_BRANCH; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch PR metadata
        id: meta
        if: steps.pr.outputs.skip == 'false'
        run: |
          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json author,title,labels,url,headRefName,baseRefName \
            > pr.json
          AUTHOR=$(jq --raw-output '.author.login' pr.json)
          IS_BOT=$(jq --raw-output '.author.is_bot' pr.json)
          TITLE=$(jq --raw-output '.title' pr.json)
          URL=$(jq --raw-output '.url' pr.json)
          HEAD_REF=$(jq --raw-output '.headRefName' pr.json)
          BASE_REF=$(jq --raw-output '.baseRefName' pr.json)
          IS_SECURITY=$(jq --raw-output \
            '[.labels[].name] | any(. == "security")' pr.json)
          IS_HELD=$(jq --raw-output --arg hold "$HOLD_LABEL" \
            '[.labels[].name] | any(. == $hold)' pr.json)
          {
            echo "author=$AUTHOR"
            echo "is_bot=$IS_BOT"
            echo "title=$TITLE"
            echo "url=$URL"
            echo "head_ref=$HEAD_REF"
            echo "base_ref=$BASE_REF"
            echo "is_security=$IS_SECURITY"
            echo "is_held=$IS_HELD"
          } >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HOLD_LABEL: ${{ inputs.hold-label }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate on author
        id: author
        if: steps.pr.outputs.skip == 'false'
        run: |
          # `gh` spells the Dependabot app author `app/dependabot`; the raw
          # API and older `gh` use `dependabot[bot]`.  Accept either, and
          # require the bot flag so a colliding human login cannot slip
          # through.
          if [ "$IS_BOT" = "true" ] && \
             { [ "$AUTHOR" = "dependabot[bot]" ] || \
               [ "$AUTHOR" = "app/dependabot" ]; }; then
            echo "is_dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR author is $AUTHOR (is_bot=$IS_BOT), not Dependabot;" \
              "skipping."
            echo "is_dependabot=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          AUTHOR: ${{ steps.meta.outputs.author }}
          IS_BOT: ${{ steps.meta.outputs.is_bot }}

      - name: Plan the run
        id: plan
        if: steps.pr.outputs.skip == 'false'
        run: |
          # A held or non-Dependabot PR is a no-op.  A failed CI run parks the
          # bump; a passing one enters processing (allowlist, rebase-first,
          # and the two-pass changelog/merge).
          if [ "$IS_DEPENDABOT" != "true" ] || [ "$IS_HELD" = "true" ]; then
            MODE=skip
          elif [ "$CONCLUSION" = "failure" ]; then
            MODE=park
          elif [ "$CONCLUSION" = "success" ]; then
            MODE=process
          else
            MODE=skip
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        env:
          IS_DEPENDABOT: ${{ steps.author.outputs.is_dependabot }}
          IS_HELD: ${{ steps.meta.outputs.is_held }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}

      # --- Failure path: park the bump under the hold label ---

      - name: Park the failing bump
        if: steps.plan.outputs.mode == 'park'
        run: |
          # `--force` upserts, so this both self-provisions the label in a
          # spawn that has never seen it and is idempotent on re-runs.
          gh label create "$HOLD_LABEL" --repo "$REPO" --force \
            --color BFD4F2 \
            --description "Dependabot bump parked: CI is failing and it needs a manual fix before it can auto-merge.  Remove to return it to the queue."
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$HOLD_LABEL"
          echo "::notice::Parked #$PR_NUMBER under $HOLD_LABEL (CI failed)."
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HOLD_LABEL: ${{ inputs.hold-label }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Success path: allowlist, rebase-first, two-pass changelog/merge ---

      # Which files a bump may touch — and whether the changelog is already
      # present — is decided by a shared, unit-tested predicate, pulled in as
      # a composite action so the rule has one definition for every spawn that
      # consumes this flow via @main.
      - name: Check the PR's files against the allowlist
        id: files
        if: steps.plan.outputs.mode == 'process'
        uses: LoganBarnett/rust-template/.github/actions/dependabot-allowlist@main
        with:
          repo: ${{ github.repository }}
          pr-number: ${{ steps.pr.outputs.number }}
          changelog-file: ${{ inputs.changelog-file }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to proceed
        id: gate
        if: steps.plan.outputs.mode == 'process'
        run: |
          if [ -n "$UNEXPECTED" ]; then
            echo "::warning::PR touches unexpected files — leaving for a human."
            echo "$UNEXPECTED"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changelog=$HAS_CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
        env:
          UNEXPECTED: ${{ steps.files.outputs.unexpected }}
          HAS_CHANGELOG: ${{ steps.files.outputs.has-changelog }}

      - name: Check whether the bump is up to date
        id: fresh
        if: steps.gate.outputs.proceed == 'true'
        run: |
          # `behind_by` is the count of base commits the head is missing;
          # under a "require up to date" rule any nonzero value blocks the
          # merge.  Read it from the commit graph (synchronous) rather than
          # mergeStateStatus (asynchronous, races).
          BEHIND=$(gh api \
            "repos/$REPO/compare/$BASE_REF...$HEAD_REF" --jq '.behind_by')
          if [ "$BEHIND" -gt 0 ]; then
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          REPO: ${{ github.repository }}
          BASE_REF: ${{ steps.meta.outputs.base_ref }}
          HEAD_REF: ${{ steps.meta.outputs.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Nudge a behind bump forward
        if: >
          steps.gate.outputs.proceed == 'true' &&
          steps.fresh.outputs.up_to_date == 'false'
        run: |
          # Bring the bump up to date before touching its branch.  If it
          # already carries the changelog commit it is disowned by Dependabot
          # (which will not rebase an edited branch), so rebuild it from
          # scratch with `recreate`; otherwise a plain `rebase` suffices.  Its
          # re-run re-enters this flow up to date.
          if [ "$HAS_CHANGELOG" = "true" ]; then
            cmd=recreate
          else
            cmd=rebase
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "@dependabot $cmd"
          echo "::notice::#$PR_NUMBER is behind $BASE_REF; requested $cmd."
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_REF: ${{ steps.meta.outputs.base_ref }}
          HAS_CHANGELOG: ${{ steps.gate.outputs.has_changelog }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Pass 1: commit the changelog and re-dispatch CI ---

      - uses: actions/checkout@v4
        if: >
          steps.gate.outputs.proceed == 'true' &&
          steps.fresh.outputs.up_to_date == 'true' &&
          steps.gate.outputs.has_changelog == 'false'
        with:
          ref: ${{ steps.meta.outputs.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history so `changelog-roller` can diff against origin/main.
          fetch-depth: 0

      # Install Nix + restore/save the `/nix` store cache so `changelog-roller`
      # is available.  See `.github/actions/setup-nix` for the rationale.
      - uses: LoganBarnett/rust-template/.github/actions/setup-nix@main
        if: >
          steps.gate.outputs.proceed == 'true' &&
          steps.fresh.outputs.up_to_date == 'true' &&
          steps.gate.outputs.has_changelog == 'false'

      - name: Commit the changelog entry and re-dispatch CI
        if: >
          steps.gate.outputs.proceed == 'true' &&
          steps.fresh.outputs.up_to_date == 'true' &&
          steps.gate.outputs.has_changelog == 'false'
        run: |
          if [ "$IS_SECURITY" = "true" ]; then
            HEADING=Security
          else
            HEADING=Maintenance
          fi
          BODY="${TITLE} (${URL})"
          # Compose the entry from the PR and insert it with the same
          # changelog-roller the CI check uses.  The CI changelog job then
          # validates it for real on the re-dispatched run — this composes the
          # entry, it does not bypass the check.
          nix develop .#ci --command changelog-roller insert-item \
            --input-file "$CHANGELOG_FILE" \
            --heading "$HEADING" \
            --body "$BODY" \
            --in-place
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CHANGELOG_FILE"
          git commit --message "changelog for #${PR_NUMBER}"
          git push origin "HEAD:$HEAD_REF"
          # A GITHUB_TOKEN push fires no `pull_request` run (no-cascade), so
          # re-run CI explicitly against the changelog commit via
          # `workflow_dispatch`, which is exempt.  That run's required checks
          # land on this SHA, and its completion re-enters this flow at pass 2.
          gh workflow run "$CI_WORKFLOW" --repo "$REPO" --ref "$HEAD_REF"
          echo "::notice::Committed changelog for #${PR_NUMBER} and re-dispatched CI."
        env:
          CHANGELOG_FILE: ${{ inputs.changelog-file }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          TITLE: ${{ steps.meta.outputs.title }}
          URL: ${{ steps.meta.outputs.url }}
          IS_SECURITY: ${{ steps.meta.outputs.is_security }}
          HEAD_REF: ${{ steps.meta.outputs.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Pass 2: squash-merge the changelog-bearing commit ---

      - name: Squash-merge the PR
        id: merge
        if: >
          steps.gate.outputs.proceed == 'true' &&
          steps.fresh.outputs.up_to_date == 'true' &&
          steps.gate.outputs.has_changelog == 'true'
        run: |
          # The merge is the gate: GitHub lands it or rejects it on its own
          # verdict.  A transient rejection is usually the brief window where
          # mergeability is still computing, so retry patiently; a persistent
          # one is a genuine block, and we leave the PR for a human.
          merged=false
          n=0
          while [ $n -lt 12 ]; do
            if gh pr merge "$PR_NUMBER" \
                --repo "$REPO" \
                --squash \
                --delete-branch; then
              merged=true
              break
            fi
            if [ "$(gh pr view "$PR_NUMBER" --repo "$REPO" \
                --json state --jq '.state')" = "MERGED" ]; then
              merged=true
              break
            fi
            n=$((n + 1))
            sleep 15
          done
          if [ "$merged" != "true" ]; then
            echo "::warning::squash-merge did not succeed after retries;" \
              "leaving #$PR_NUMBER for a human."
          fi
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch publish
        if: >
          steps.merge.outputs.merged == 'true' &&
          inputs.publish-workflow != ''
        run: gh workflow run "$WORKFLOW" --repo "$REPO" --ref "$BASE_REF"
        env:
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ inputs.publish-workflow }}
          BASE_REF: ${{ steps.meta.outputs.base_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Advance the queue ---

      - name: Advance the queue
        if: >
          steps.plan.outputs.mode == 'park' ||
          steps.merge.outputs.merged == 'true' ||
          (steps.plan.outputs.mode == 'process' &&
           steps.gate.outputs.proceed == 'false')
        continue-on-error: true
        run: |
          # Nudge exactly one bump — the oldest open, Dependabot-authored,
          # non-held PR that has fallen behind the base — to bring it forward.
          # A branch carrying the changelog commit is disowned by Dependabot
          # and ignores `rebase`, so it is `recreate`d instead.  One nudge per
          # run keeps the drain strictly serial.
          gh pr list --repo "$REPO" --state open --limit 50 \
            --json number,createdAt,author,labels,headRefName > queue.json
          numbers=$(jq --raw-output --arg hold "$HOLD_LABEL" '
            [ .[]
              | select(
                  (.author.login == "dependabot[bot]"
                    or .author.login == "app/dependabot")
                  and (any(.labels[].name; . == $hold) | not)
                )
            ] | sort_by(.createdAt) | .[].number' queue.json)
          for n in $numbers; do
            head=$(jq --raw-output --argjson n "$n" \
              '.[] | select(.number == $n) | .headRefName' queue.json)
            behind=$(gh api "repos/$REPO/compare/$BASE...$head" \
              --jq '.behind_by' 2>/dev/null || echo 0)
            if [ "$behind" -gt 0 ]; then
              external=$(gh pr view "$n" --repo "$REPO" --json commits --jq '
                [ .commits[].authors[].login ]
                | map(. != "dependabot[bot]" and . != "app/dependabot")
                | any')
              if [ "$external" = "true" ]; then
                cmd=recreate
              else
                cmd=rebase
              fi
              gh pr comment "$n" --repo "$REPO" --body "@dependabot $cmd"
              echo "::notice::Advanced queue: requested $cmd on #$n ($behind behind)."
              break
            fi
          done
        env:
          REPO: ${{ github.repository }}
          BASE: ${{ steps.meta.outputs.base_ref }}
          HOLD_LABEL: ${{ inputs.hold-label }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
