name: CI (reusable)

# Every job runs inside `nix develop --command`, so the toolchain and
# auxiliary binaries (rustfmt, clippy, changelog-roller, treefmt, ...)
# come from the consumer's `flake.nix` devShell rather than being
# reinstalled per-job via `dtolnay/rust-toolchain` or `cargo install`.
# That collapses "works locally" and "works in CI" into a single
# environment, which is the divergence that historically broke
# spawned projects.

on:
  workflow_call:
    inputs:
      changelog-file:
        type: string
        default: "CHANGELOG.org"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # `Swatinem/rust-cache` caches `~/.cargo/registry` and `target/`
      # — orthogonal to the Nix store cache above, which holds the
      # toolchain and devShell inputs.
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: nix develop --command cargo test --workspace

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check formatting
        run: nix develop --command cargo fmt --all -- --check

  clippy:
    name: Clippy (warnings denied)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: Swatinem/rust-cache@v2

      # `--deny warnings` upgrades every clippy warning — including
      # the combinator-favoring lints configured at `warn` in
      # `[workspace.lints.clippy]` — to a hard error.  Locally those
      # remain warnings so iteration is not blocked; merge gating
      # happens here, in a job distinct from `test` so a failure
      # reads as "tests are fine, lint nitpicks remain" rather than
      # being conflated with broken tests.
      - name: Run clippy with warnings as errors
        run: nix develop --command cargo clippy --workspace --all-targets -- --deny warnings

  changelog:
    name: Changelog entry required
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check for new changelog entries
        run: >
          nix develop --command
          changelog-roller check-additions
          --input-file ${{ inputs.changelog-file }}
          --base origin/main
