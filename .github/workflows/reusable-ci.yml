name: CI (reusable)

# Every job runs inside `nix develop .#ci --command`, so the toolchain
# and release binaries (rustfmt, clippy, changelog-roller,
# cargo-semver-checks) come from the consumer's dedicated `ci` devShell
# rather than being reinstalled per-job via `dtolnay/rust-toolchain` or
# `cargo install`.  That collapses "works locally" and "works in CI" into
# a single environment, which is the divergence that historically broke
# spawned projects.  The `ci` shell is foundation's mkCiShell baseline —
# the Rust toolchain plus the release CLIs these jobs invoke
# (changelog-roller, cargo-semver-checks) — and omits the interactive
# `default` shell's extras (the Elm toolchain, the treefmt formatter
# stack, `just`), so it is cheaper to realize.  (The Elm frontend, when a
# project ships one, is a package-build input under `nix build`, not
# something any devShell provides.)  A spawn overrides its own `.#ci` in
# its `flake.nix`.

on:
  workflow_call:
    inputs:
      changelog-file:
        type: string
        default: "CHANGELOG.org"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install Nix + restore/save the `/nix` store cache.  See
      # `.github/actions/setup-nix` for the rationale.
      - uses: LoganBarnett/rust-template/.github/actions/setup-nix@main

      # `Swatinem/rust-cache` caches `~/.cargo/registry` and `target/`
      # — orthogonal to the Nix store cache above, which holds the
      # toolchain and devShell inputs.
      - uses: Swatinem/rust-cache@v2

      # `--all-features` so tests gated by optional features (cli,
      # server, auth) actually compile and run.  Without this they
      # silently skip, which reads as a passing test suite but means
      # the feature-gated code paths are never exercised — a false-
      # green that is worse than the broken-test alternative.
      - name: Run tests
        run: |
          nix develop .#ci --command \
            cargo test \
            --workspace \
            --all-features

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install Nix + restore/save the `/nix` store cache.  See
      # `.github/actions/setup-nix` for the rationale.
      - uses: LoganBarnett/rust-template/.github/actions/setup-nix@main

      - name: Check formatting
        run: nix develop .#ci --command cargo fmt --all -- --check

  clippy:
    name: Clippy (warnings denied)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install Nix + restore/save the `/nix` store cache.  See
      # `.github/actions/setup-nix` for the rationale.
      - uses: LoganBarnett/rust-template/.github/actions/setup-nix@main

      - uses: Swatinem/rust-cache@v2

      # `--deny warnings` upgrades every clippy warning — including
      # the combinator-favoring lints configured at `warn` in
      # `[workspace.lints.clippy]` — to a hard error.  Locally those
      # remain warnings so iteration is not blocked; merge gating
      # happens here, in a job distinct from `test` so a failure
      # reads as "tests are fine, lint nitpicks remain" rather than
      # being conflated with broken tests.
      - name: Run clippy with warnings as errors
        run: |
          nix develop .#ci --command \
            cargo clippy \
            --workspace \
            --all-targets \
            --all-features \
            -- \
            --deny warnings

  changelog:
    name: Changelog entry required
    runs-on: ubuntu-latest
    # Runs on PRs and on pushes (direct-to-main as well as branch
    # pushes) so the changelog-entry requirement holds on every path
    # into main, not only the PR-merge path.
    #
    # The dependabot exclusion below is mechanical, not a free pass.
    # The reusable-dependabot-automerge.yml wrapper gates on
    # `workflow_run.conclusion == 'success'`, so first-pass CI has
    # to be green for the automerge flow to fire and inject the
    # changelog entry.  Automerge pushes that injection via
    # GITHUB_TOKEN with github-actions[bot] as the actor, so the
    # exclusion does not apply on the second pass — the entry is
    # now in the diff and the check enforces it for real.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Nix + restore/save the `/nix` store cache.  See
      # `.github/actions/setup-nix` for the rationale.
      - uses: LoganBarnett/rust-template/.github/actions/setup-nix@main

      # Diff target depends on the event:
      # - PR or push to a non-main branch: `origin/main` (the merge
      #   target / long-lived reference contributors are working
      #   away from).
      # - Push to main: `github.event.before`, the SHA before the
      #   push.  PR-merge pushes still pass since the merged diff
      #   contains the entry that gated the PR; direct pushes to
      #   main are caught here instead of slipping through.
      - name: Check for new changelog entries
        run: |
          if [ "${{ github.event_name }}" = "push" ] \
              && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            base="${{ github.event.before }}"
          else
            base="origin/main"
          fi
          nix develop .#ci --command \
            changelog-roller check-additions \
            --input-file "${{ inputs.changelog-file }}" \
            --base "$base"

  abi:
    name: ABI compatibility
    runs-on: ubuntu-latest
    # Runs on PRs and on pushes so the asymmetric "ABI break ⇒
    # Breaking entry" rule holds on every path into main, including
    # direct pushes that bypass the PR flow.
    #
    # Same first-pass dependabot exclusion as the `changelog` job
    # documents above, and for the same mechanical reason.
    # Enforcement happens on the second pass: an ABI-breaking dep
    # bump whose automerge-injected entry lands under Maintenance
    # rather than Breaking fails here, mergeStateStatus stops being
    # CLEAN, and auto-merge stalls until a human moves the entry.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Nix + restore/save the `/nix` store cache.  See
      # `.github/actions/setup-nix` for the rationale.
      - uses: LoganBarnett/rust-template/.github/actions/setup-nix@main

      - uses: Swatinem/rust-cache@v2

      # `cargo-semver-checks` compares the workspace's current public API
      # against the version of each crate published on crates.io.  Three
      # outcomes are possible:
      #
      #   1. No breaking changes — exit 0; the job finishes without
      #      consulting the changelog.
      #   2. Breaking changes detected — exit non-zero with a "requires
      #      new major version" line in the output; the follow-up step
      #      then requires an Upcoming → Breaking changelog entry.
      #   3. No baseline available (crate has never been published, or
      #      crates.io can't be reached) — exit non-zero with no such
      #      marker; treated as a soft skip, since the asymmetric rule is
      #      "ABI break implies Breaking entry," not "first publish
      #      requires one."  An explicit Breaking entry the contributor
      #      added by hand still lands fine; we just don't force one.
      - name: Run cargo-semver-checks against crates.io baseline
        id: semver
        run: |
          LOG=$(mktemp)
          set +o pipefail
          nix develop .#ci --command cargo semver-checks --workspace 2>&1 \
            | tee "$LOG"
          EXIT=${PIPESTATUS[0]}
          set -o pipefail
          if [ "$EXIT" -eq 0 ]; then
            echo "No ABI-breaking changes detected."
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          elif grep --quiet --extended-regexp \
              'semver requires new major version|breaking changes detected' \
              "$LOG"; then
            echo "ABI-breaking changes detected; an Upcoming → Breaking changelog entry is required."
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::cargo-semver-checks exited non-zero without reporting breaking changes (e.g. no published baseline on crates.io).  Skipping the Upcoming → Breaking gate."
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          fi

      # The asymmetry the user spec'd: a Breaking entry *can* be added
      # without an ABI break (e.g. a behavioural change that doesn't show
      # up in the type signature), but an ABI break *must* be accompanied
      # by one.  This step only runs when semver-checks proved an ABI
      # break, so a missing entry here is unambiguously a documentation
      # gap and not a false positive.
      # Same base-ref selection as the `changelog` job above: pushes
      # to main diff against `github.event.before` so direct pushes
      # are gated; everything else diffs against `origin/main`.
      - name: Require Upcoming → Breaking changelog entry
        if: steps.semver.outputs.breaking == 'true'
        run: |
          if [ "${{ github.event_name }}" = "push" ] \
              && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            base="${{ github.event.before }}"
          else
            base="origin/main"
          fi
          nix develop .#ci --command \
            changelog-roller check-additions \
            --input-file "${{ inputs.changelog-file }}" \
            --base "$base" \
            --under Breaking

  release-artifacts:
    name: Release artifacts build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install Nix; restore-only.  `save-store: "false"` keeps this
      # job's large musl/zig-cross-darwin closures from bloating and
      # LRU-evicting the shared toolchain cache — see
      # `.github/actions/setup-nix` for the full rationale.
      - uses: LoganBarnett/rust-template/.github/actions/setup-nix@main
        with:
          save-store: "false"

      # Build every release artifact an x86_64-linux runner can produce — the
      # native glibc binary, the static musl variant, and the two zig-cross
      # macOS variants — for each crate that ships a binary, so an artifact that
      # will not build fails the PR rather than only surfacing when a release
      # runs the binaries matrix.  The macOS builds cross-compile on Linux (no
      # macOS runner, no Apple SDK for a libSystem crate), so the cost is a
      # normal compile plus a cached toolchain, not a darwin-runner queue.  The
      # aarch64-linux gnu/musl targets are omitted: they run the same
      # mk*Packages code path as the x86_64 variants with only a different
      # target triple, so the x86_64 set transitively covers them without an ARM
      # runner.
      # The crate set comes from rust-template.json's release-binary flags — the
      # same source the release-binaries workflow uses — so a project that ships
      # no binaries builds nothing.
      - name: Build the x86_64-producible release attrs
        run: |
          crates=$(jq --compact-output \
            '[.workspaces | to_entries[]
              | select(.value."release-binary") | .key]' \
            rust-template.json)
          if [ "$crates" = "[]" ]; then
            echo "No release-binary crates; nothing to build."
            exit 0
          fi
          attrs=()
          for crate in $(echo "$crates" | jq --raw-output '.[]'); do
            for suffix in "" -musl -aarch64-darwin -x86_64-darwin; do
              attrs+=(".#packages.x86_64-linux.${crate}${suffix}")
            done
          done
          nix build --no-link --print-out-paths "${attrs[@]}"
