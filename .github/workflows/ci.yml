name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Local path (`./...`) rather than `LoganBarnett/rust-template/...@main`
  # so that PRs modifying `reusable-ci.yml` are tested against the SHA in
  # the PR, not whatever is on main.  Spawned projects use the `@main`
  # form (see `template/.github/workflows/ci.yml`) since they want to
  # follow rust-template's main, not pin to their own checkout.
  ci:
    uses: ./.github/workflows/reusable-ci.yml

  # Formatter coverage lives in this repo's CI rather than in
  # `reusable-ci.yml` because it is a property of rust-template itself,
  # not of spawned projects.  It exercises `new-project.sh` to produce
  # a fresh spawn, then verifies every formatter declared in the
  # template's `treefmt.toml` is on PATH inside the spawn's devShell
  # and actually rewrites a known-malformed file.  Half-failures (a
  # formatter declared but not in the devShell, or vice versa) both
  # surface as a failed assertion.
  #
  # `install-nix-action` plus `magic-nix-cache-action` get treefmt and
  # the per-language formatter binaries from the nixpkgs binary cache
  # rather than reinstalling each formatter via apt/cargo/npm — that
  # divergence between local-via-Nix and CI-via-ad-hoc is the class of
  # bug the template is built to capture as code in the first place.
  formatter-coverage:
    name: Formatter coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Run inside the rust-template devShell so `new-project.sh` (which
      # the test invokes) has `treefmt` and the per-language formatter
      # binaries on PATH -- the script itself does not bootstrap into a
      # devShell; it expects the caller to have set up their environment.
      - name: Run formatter-coverage test
        run: nix develop --command ./test-formatters.sh

  # Proves a freshly-spawned project resolves its `rust-template-foundation`
  # git dependency over `ssh://git@github.com/...` on a clean GitHub-hosted
  # runner — i.e. without us provisioning a github SSH key.  GitHub's runners
  # can clone github.com through their own infrastructure, so `ssh://` should
  # resolve; this job keeps that assumption honest.  `template/Cargo.toml`
  # historically used `https://` as a workaround for this fetch failing on
  # keyless runners, so a red here means the workaround is still needed —
  # revert `template/Cargo.toml` back to `https://`.
  #
  # `cargo fetch` (not a full build) is enough: it resolves the dependency
  # graph and clones the git dep, which is exactly the ssh operation under
  # test, without paying for a compile.
  spawn-ssh-fetch:
    name: Spawn SSH fetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Spawn a project and cargo fetch its ssh git dependency
        run: |
          set -euo pipefail
          spawn="$(mktemp --directory)/ssh-fetch-test"
          # new-project.sh expects the caller's environment to already carry
          # the rust-template devShell tools, hence the outer `nix develop`.
          nix develop --command ./new-project.sh \
            --name ssh-fetch-test \
            --output "$spawn" \
            --crates cli \
            --description "ssh keyless fetch test"
          # cargo fetch inside the spawn's own devShell clones the
          # ssh://git@github.com rust-template-foundation dependency.
          ( cd "$spawn" && nix develop --command cargo fetch --verbose )
