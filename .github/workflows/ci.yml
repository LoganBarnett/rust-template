name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Local path (`./...`) rather than `LoganBarnett/rust-template/...@main`
  # so that PRs modifying `reusable-ci.yml` are tested against the SHA in
  # the PR, not whatever is on main.  Spawned projects use the `@main`
  # form (see `template/.github/workflows/ci.yml`) since they want to
  # follow rust-template's main, not pin to their own checkout.
  ci:
    uses: ./.github/workflows/reusable-ci.yml

  # rust-template's own test scripts, distinct from `reusable-ci.yml` (which
  # tests the workspace crates): these exercise the project generator
  # (`new-project.sh`, `crate-add.sh`) and rust-template-specific tooling, so
  # they are a property of this repo rather than of spawned projects and live
  # here instead of in the reusable workflow.  The same scripts run locally via
  # `just test`; both lists must gain a script for it to gate everywhere.
  #
  # Each runs inside the rust-template devShell: the scripts do not bootstrap
  # their own environment — they expect the caller to provide treefmt, cargo,
  # and the tools `new-project.sh` needs.  The `setup-nix` composite action
  # pulls those from the nixpkgs binary cache (and the cached `/nix` store)
  # rather than reinstalling each via apt/cargo/npm — that local-vs-CI
  # divergence is the class of bug the template is built to capture as code.
  # See `.github/actions/setup-nix` for the installer/cache rationale.
  #
  # `fail-fast: false` so one failing script does not cancel the others, and
  # each surfaces as its own named check.
  template-tests:
    name: Template test (${{ matrix.script }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - test-crate-add.sh
          - test-formatters.sh
          - ci-test.sh
          - test-review-stop.sh
    steps:
      - uses: actions/checkout@v4

      # Install Nix + restore/save the `/nix` store cache.  Local `./`
      # ref (the `reusable-*.yml` workflows use the `@main` form) so a PR
      # editing the action is tested against the PR's own copy — same
      # reasoning as the `ci` job's local `reusable-ci.yml` ref above.
      # See `.github/actions/setup-nix` for the rationale.
      - uses: ./.github/actions/setup-nix

      - name: Run ${{ matrix.script }}
        run: nix develop --command ./${{ matrix.script }}

  # Guards mkDarwinCrossPackages against the two darwin cross-compile paths the
  # release crates never exercise: a C-compiling dependency (`ring`, compiled by
  # zig in crane's deps-only phase) and Apple framework linking (CoreFoundation,
  # resolved against the SDK's `.tbd` stubs).  The cross-fixture crate carries
  # both; building its darwin attrs here fails the PR if either path regresses.
  # This lives in rust-template's own workflow rather than reusable-ci.yml
  # because the fixture is specific to this repo — spawned projects have no such
  # crate.  Only x86_64-linux produces the cross output, hence ubuntu.
  darwin-cross-fixture:
    name: Darwin cross fixture build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install Nix; restore-only cross-compile job.  Local `./` ref for
      # PR self-testing (see `template-tests` above); `save-store:
      # "false"` so its zig-cross-darwin closure does not evict the
      # shared toolchain cache.  See `.github/actions/setup-nix`.
      - uses: ./.github/actions/setup-nix
        with:
          save-store: "false"

      # Unfree acceptance for the Apple SDK lives in flake.nix (pkgsUnfreeFor),
      # so no NIXPKGS_ALLOW_UNFREE is needed here.
      - name: Build the cross-fixture darwin variants
        run: |
          nix build --no-link --print-out-paths \
            '.#packages.x86_64-linux.cross-fixture-aarch64-darwin' \
            '.#packages.x86_64-linux.cross-fixture-x86_64-darwin'
