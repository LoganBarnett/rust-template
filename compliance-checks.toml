# Compliance checks for spawned repositories.
#
# Each [[check]] has a stable `id` (printed on failure), a human `description`,
# a `kind` from the finite set the engine implements, and that kind's
# parameters.  An optional `when_crates_contains` restricts a check to spawns
# whose crate-role list contains the given substring.  A spawn may opt out of
# any check by listing its id under `compliance-ignores` in its
# rust-template.json.
#
# Paths in `target` / `path` are relative to a spawn's project root.  See
# crates/compliance-lib for the kinds and docs/compliance.org for how this
# checker fits the broader compliance process.

# ── Required files ───────────────────────────────────────────────────

[[check]]
id = "required-file-changelog"
description = "The project keeps a CHANGELOG.org."
kind = "file-present"
path = "CHANGELOG.org"

[[check]]
id = "required-file-tasks"
description = "The project keeps a tasks.org backlog."
kind = "file-present"
path = "tasks.org"

[[check]]
id = "required-file-envrc"
description = "The project ships a .envrc for direnv/devshell activation."
kind = "file-present"
path = ".envrc"

[[check]]
id = "required-file-rustfmt"
description = "The workspace rustfmt.toml is present."
kind = "file-present"
path = "rustfmt.toml"

[[check]]
id = "required-file-cargo-toml"
description = "The workspace Cargo.toml is present."
kind = "file-present"
path = "Cargo.toml"

[[check]]
id = "required-file-flake-nix"
description = "The project provides a Nix flake."
kind = "file-present"
path = "flake.nix"

[[check]]
id = "required-file-flake-lock"
description = "The Nix flake lock is committed."
kind = "file-present"
path = "flake.lock"

[[check]]
id = "required-file-ci-workflow"
description = "The project has a CI workflow."
kind = "file-present"
path = ".github/workflows/ci.yml"

# ── Provenance ───────────────────────────────────────────────────────

[[check]]
id = "provenance-present"
description = "The rust-template.json provenance file is present."
kind = "file-present"
path = "rust-template.json"

[[check]]
id = "provenance-valid-json"
description = "The rust-template.json provenance file parses as JSON."
kind = "json-valid"
path = "rust-template.json"

# ── Foundation wiring ────────────────────────────────────────────────

[[check]]
id = "foundation-dependency-present"
description = "The workspace Cargo.toml depends on rust-template-foundation."
kind = "file-contains"
target = "Cargo.toml"
contains = "rust-template-foundation"

[[check]]
id = "ci-uses-reusable-workflows"
description = "CI calls the reusable workflows from rust-template."
kind = "file-contains"
target = ".github/workflows/ci.yml"
# The owner is omitted so a fork's spawns (which call their own
# fork/rust-template reusable workflows) pass too; only the repo name and the
# reusable-workflow path are fixed.  See tasks.org for full fork support.
contains = "rust-template/"

[[check]]
id = "flake-foundation-input"
description = "The flake references rust-template as its foundation input."
kind = "file-contains"
target = "flake.nix"
# Match the bare project name rather than the GitHub URL: a spawn normally
# points its foundation input at github:LoganBarnett/rust-template, but a test
# (or a local-development checkout) may point it at a file:// path to an
# on-disk rust-template instead.  Both spell "rust-template" in the input URL,
# and that string appears nowhere else in a spawn's flake.nix.
contains = "rust-template"

[[check]]
id = "flake-darwin-cross-wired"
description = "The flake wires mkDarwinCrossPackages so macOS binaries cross-compile on Linux instead of on a macOS runner."
kind = "file-contains"
target = "flake.nix"
contains = "mkDarwinCrossPackages"

# The always-on Windows cross build, the mirror of the darwin check above.
# Unlike darwin (which only runs on x86_64-linux), the Windows helper is
# host-agnostic — it cross-compiles native Windows PEs via llvm-mingw for the
# gnullvm targets on any host — so its `<crate>-{x86_64,aarch64}-windows`
# outputs resolve on whatever system the checker runs on.  These evaluate the
# flake rather than grepping it: a passing check proves the packages actually
# resolve (which also forces the whole package set — including the opt-in MSVC
# merge — to evaluate), not merely that a call producing them appears in the
# text.  The crate prefix varies per spawn, so they match by name suffix.  See
# the "Windows binaries" section of CONTRIBUTING.org.
[[check]]
id = "flake-windows-x86-package"
description = "The flake exposes an x86_64 native-Windows (gnullvm) package output that resolves."
kind = "flake-output-present"
output = "packages"
suffix = "-x86_64-windows"

[[check]]
id = "flake-windows-aarch64-package"
description = "The flake exposes an aarch64 native-Windows (gnullvm) package output that resolves."
kind = "flake-output-present"
output = "packages"
suffix = "-aarch64-windows"

# The wine smoke check that proves the x86_64 Windows binary executes, not just
# links.  The flake gates it to x86_64-linux (wine cannot exec an aarch64 PE),
# so this evaluates the x86_64-linux checks set explicitly — its presence
# resolves from any host even though the derivation only builds there.
[[check]]
id = "flake-windows-smoke-check"
description = "The flake exposes the windowsSmoke check on x86_64-linux so the x86_64 Windows binary is run under wine, not merely linked."
kind = "flake-output-present"
output = "checks"
system = "x86_64-linux"
attr = "windowsSmoke"

[[check]]
id = "server-foundation-auth-feature"
description = "A server-crate spawn enables the foundation \"auth\" feature."
kind = "foundation-feature"
feature = "auth"
when_crates_contains = "server"

[[check]]
id = "cli-foundation-cli-feature"
description = "A cli-crate spawn enables the foundation \"cli\" feature."
kind = "foundation-feature"
feature = "cli"
when_crates_contains = "cli"

# ── Hygiene ──────────────────────────────────────────────────────────

[[check]]
id = "no-stale-rust-template-literals"
description = "No stale rust-template literals remain (foundation refs and the GitHub URL are allowed)."
kind = "no-stale-literal"

# ── Documentation (llms.org) ─────────────────────────────────────────

[[check]]
id = "llms-template-compliance-section"
description = "llms.org carries the \"Template compliance\" section."
kind = "section-exists"
target = "llms.org"
section = ["Template compliance"]

[[check]]
id = "llms-template-compliance-points-to-canonical-docs"
description = "The Template compliance section points to the canonical docs/compliance.org."
kind = "mention-present"
target = "llms.org"
section = ["Template compliance"]
contains = "docs/compliance.org"

[[check]]
id = "llms-persistent-memory-section"
description = "llms.org carries the \"Persistent memory\" section."
kind = "section-exists"
target = "llms.org"
section = ["Persistent memory"]

[[check]]
id = "llms-capturing-plans-section"
description = "llms.org carries the \"Capturing plans\" section."
kind = "section-exists"
target = "llms.org"
section = ["Capturing plans"]

[[check]]
id = "llms-capturing-plans-flips-todo-in-pr"
description = "The Capturing plans section states that completing a TODO flips it to DONE in the same PR."
kind = "mention-present"
target = "llms.org"
section = ["Capturing plans"]
contains = "in the same change set that does the work"

[[check]]
id = "llms-read-contributing-section"
description = "llms.org carries the \"Read CONTRIBUTING.org before contributing\" section directing the agent to the contribution conventions."
kind = "section-exists"
target = "llms.org"
section = ["Read CONTRIBUTING.org before contributing"]

[[check]]
id = "llms-read-contributing-covers-landing"
description = "The Read CONTRIBUTING.org section states that CONTRIBUTING.org covers how to land a change."
kind = "mention-present"
target = "llms.org"
section = ["Read CONTRIBUTING.org before contributing"]
contains = "covers how to land a change"

# ── Foundation pin agreement ─────────────────────────────────────────

[[check]]
id = "foundation-pins-agree"
description = "The Cargo.lock and flake.lock foundation revisions agree with each other."
kind = "pins-agree"

[[check]]
id = "foundation-pins-current"
description = "Both foundation pins match the current rust-template HEAD."
kind = "pins-current"

# ── New checks (workflow machinery, foundation main/config, server
#    delegation, doc sections, workspace inheritance, ...) ──────────
# ======== github-yaml ========
# ---------------------------------------------------------------------------
# CI workflow (.github/workflows/ci.yml) — always emitted.
# ---------------------------------------------------------------------------

[[check]]
id = "ci-workflow-uses-reusable"
description = "The ci job must delegate to the rust-template reusable-ci workflow."
kind = "yaml-path-contains"
target = ".github/workflows/ci.yml"
pointer = "jobs.ci.uses"
# Owner-agnostic (a fork delegates to its own copy); the repo name and
# reusable-workflow path are still required.  See tasks.org for full fork
# support.
contains = "rust-template/.github/workflows/reusable-ci.yml@main"

[[check]]
id = "ci-workflow-push-main"
description = "CI must trigger on pushes to the main branch."
kind = "yaml-seq-contains"
target = ".github/workflows/ci.yml"
pointer = "on.push.branches"
value = "main"

[[check]]
id = "ci-workflow-pull-request-main"
description = "CI must trigger on pull requests targeting the main branch."
kind = "yaml-seq-contains"
target = ".github/workflows/ci.yml"
pointer = "on.pull_request.branches"
value = "main"

# ---------------------------------------------------------------------------
# Publish workflow (.github/workflows/publish.yml) — emitted in every spawn,
# public or private.  Whether it publishes to crates.io is governed by each
# crate's publish destination list, so these checks run unconditionally.
# ---------------------------------------------------------------------------

[[check]]
id = "publish-workflow-present"
description = "The publish workflow file must exist in every spawn."
kind = "file-present"
path = ".github/workflows/publish.yml"

[[check]]
id = "publish-workflow-uses-reusable"
description = "The publish job must delegate to the rust-template reusable-publish workflow."
kind = "yaml-path-contains"
target = ".github/workflows/publish.yml"
pointer = "jobs.publish.uses"
contains = "rust-template/.github/workflows/reusable-publish.yml@main"

[[check]]
id = "publish-workflow-push-main"
description = "Publish must trigger on pushes to the main branch."
kind = "yaml-seq-contains"
target = ".github/workflows/publish.yml"
pointer = "on.push.branches"
value = "main"

[[check]]
id = "publish-workflow-workflow-dispatch"
description = "Publish must be dispatchable so dependabot-automerge can fire it after a merge."
kind = "yaml-path-exists"
target = ".github/workflows/publish.yml"
pointer = "on.workflow_dispatch"

[[check]]
id = "publish-workflow-contents-write"
description = "Publish must grant contents: write at the workflow level."
kind = "yaml-path-equals"
target = ".github/workflows/publish.yml"
pointer = "permissions.contents"
value = "write"

[[check]]
id = "publish-workflow-id-token-write"
description = "Publish must grant id-token: write so the reusable workflow can mint the crates.io OIDC token."
kind = "yaml-path-equals"
target = ".github/workflows/publish.yml"
pointer = "permissions.id-token"
value = "write"

# ---------------------------------------------------------------------------
# Release-binaries workflow (.github/workflows/release-binaries.yml) — emitted
# in every spawn, dispatched by the publish run after it tags a release.
# Whether it produces any artifact is governed by each crate's release-binary
# flag in rust-template.json, so its presence is checked unconditionally.
# ---------------------------------------------------------------------------

[[check]]
id = "release-binaries-workflow-present"
description = "The release-binaries workflow file must exist in every spawn."
kind = "file-present"
path = ".github/workflows/release-binaries.yml"

[[check]]
id = "release-binaries-workflow-uses-reusable"
description = "The release-binaries job must delegate to the rust-template reusable workflow."
kind = "yaml-path-contains"
target = ".github/workflows/release-binaries.yml"
pointer = "jobs.release-binaries.uses"
contains = "rust-template/.github/workflows/reusable-release-binaries.yml@main"

[[check]]
id = "release-binaries-workflow-dispatch"
description = "Release-binaries must be dispatchable so the publish run can fire it after tagging."
kind = "yaml-path-exists"
target = ".github/workflows/release-binaries.yml"
pointer = "on.workflow_dispatch"

[[check]]
id = "release-binaries-workflow-id-token-write"
description = "Release-binaries must grant id-token: write so the build can mint the Sigstore signing token for build-provenance attestation."
kind = "yaml-path-equals"
target = ".github/workflows/release-binaries.yml"
pointer = "permissions.id-token"
value = "write"

[[check]]
id = "release-binaries-workflow-attestations-write"
description = "Release-binaries must grant attestations: write so the build can record build-provenance attestations for each artifact."
kind = "yaml-path-equals"
target = ".github/workflows/release-binaries.yml"
pointer = "permissions.attestations"
value = "write"

# ---------------------------------------------------------------------------
# Branch-protection workflow (.github/workflows/branch-protection.yml) —
# always emitted.
# ---------------------------------------------------------------------------

[[check]]
id = "branch-protection-workflow-present"
description = "The branch-protection workflow file must exist."
kind = "file-present"
path = ".github/workflows/branch-protection.yml"

[[check]]
id = "branch-protection-workflow-uses-reusable"
description = "The apply job must delegate to the rust-template reusable-branch-protection workflow."
kind = "yaml-path-contains"
target = ".github/workflows/branch-protection.yml"
pointer = "jobs.apply.uses"
contains = "rust-template/.github/workflows/reusable-branch-protection.yml@main"

[[check]]
id = "branch-protection-workflow-push-main"
description = "The branch-protection workflow must trigger on pushes to the main branch."
kind = "yaml-seq-contains"
target = ".github/workflows/branch-protection.yml"
pointer = "on.push.branches"
value = "main"

# ---------------------------------------------------------------------------
# Dependabot auto-merge workflow (.github/workflows/dependabot-automerge.yml)
# — always emitted.
#
# The compliance surface stops at this wrapper and its @main delegation to
# rust-template's reusable-dependabot-automerge workflow (asserted just below).
# Everything that reusable workflow pulls in — the setup-nix action, and the
# dependabot-allowlist composite action with its allowlist.sh predicate — is
# referenced by @main and lives only in rust-template; it is never emitted into
# a spawn, so no per-spawn file-present check applies to it (the same reason
# setup-nix has none).  The allowlist predicate's own correctness is instead
# guarded by test-dependabot-allowlist.sh in this repo's CI.
# ---------------------------------------------------------------------------

[[check]]
id = "dependabot-automerge-workflow-present"
description = "The dependabot auto-merge workflow file must exist."
kind = "file-present"
path = ".github/workflows/dependabot-automerge.yml"

[[check]]
id = "dependabot-automerge-uses-reusable"
description = "The automerge job must delegate to the rust-template reusable-dependabot-automerge workflow."
kind = "yaml-path-contains"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "jobs.automerge.uses"
contains = "rust-template/.github/workflows/reusable-dependabot-automerge.yml@main"

[[check]]
id = "dependabot-automerge-workflow-run-ci"
description = "Auto-merge must listen for completion of the CI workflow via workflow_run."
kind = "yaml-seq-contains"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "on.workflow_run.workflows"
value = "CI"

[[check]]
id = "dependabot-automerge-workflow-run-completed"
description = "Auto-merge must fire on the completed type of the workflow_run event."
kind = "yaml-seq-contains"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "on.workflow_run.types"
value = "completed"

[[check]]
id = "dependabot-automerge-if-guards-pull-request"
description = "The automerge job must guard on the upstream run having been a pull_request event."
kind = "yaml-path-contains"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "jobs.automerge.if"
contains = "github.event.workflow_run.event == 'pull_request'"

[[check]]
id = "dependabot-automerge-if-guards-success"
description = "The automerge job must guard on the upstream CI run having succeeded."
kind = "yaml-path-contains"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "jobs.automerge.if"
contains = "github.event.workflow_run.conclusion == 'success'"

[[check]]
id = "dependabot-automerge-contents-write"
description = "Auto-merge must grant contents: write to push the changelog commit after the squash-merge."
kind = "yaml-path-equals"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "permissions.contents"
value = "write"

[[check]]
id = "dependabot-automerge-pull-requests-write"
description = "Auto-merge must grant pull-requests: write to perform the merge."
kind = "yaml-path-equals"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "permissions.pull-requests"
value = "write"

[[check]]
id = "dependabot-automerge-actions-write"
description = "Auto-merge must grant actions: write to dispatch the publish workflow after merge."
kind = "yaml-path-equals"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "permissions.actions"
value = "write"

# ---------------------------------------------------------------------------
# Dependabot config (.github/dependabot.yml) — always emitted.
# ---------------------------------------------------------------------------

[[check]]
id = "dependabot-config-present"
description = "The dependabot configuration file must exist."
kind = "file-present"
path = ".github/dependabot.yml"

[[check]]
id = "dependabot-config-version"
description = "The dependabot config must declare config version 2."
kind = "yaml-path-equals"
target = ".github/dependabot.yml"
pointer = "version"
value = "2"

[[check]]
id = "dependabot-config-cargo-ecosystem"
description = "Dependabot must update the cargo ecosystem."
kind = "yaml-path-equals"
target = ".github/dependabot.yml"
pointer = "updates.0.package-ecosystem"
value = "cargo"

[[check]]
id = "dependabot-config-github-actions-ecosystem"
description = "Dependabot must update the github-actions ecosystem."
kind = "yaml-path-equals"
target = ".github/dependabot.yml"
pointer = "updates.1.package-ecosystem"
value = "github-actions"

# ---------------------------------------------------------------------------
# Branch-protection rules (.github/branch-protection.json) — always emitted.
# ---------------------------------------------------------------------------

[[check]]
id = "branch-protection-json-present"
description = "The branch-protection rules file must exist."
kind = "file-present"
path = ".github/branch-protection.json"

[[check]]
id = "branch-protection-json-valid"
description = "The branch-protection rules file must be valid JSON."
kind = "json-valid"
path = ".github/branch-protection.json"

[[check]]
id = "branch-protection-json-strict-status-checks"
description = "Branch protection must require strict (up-to-date) status checks."
kind = "json-path-equals"
target = ".github/branch-protection.json"
pointer = "required_status_checks.strict"
value = "true"

[[check]]
id = "branch-protection-json-context-test"
description = "Branch protection must require the 'ci / Test' status check."
kind = "json-seq-contains"
target = ".github/branch-protection.json"
pointer = "required_status_checks.contexts"
value = "ci / Test"

[[check]]
id = "branch-protection-json-context-formatting"
description = "Branch protection must require the 'ci / Formatting' status check."
kind = "json-seq-contains"
target = ".github/branch-protection.json"
pointer = "required_status_checks.contexts"
value = "ci / Formatting"

[[check]]
id = "branch-protection-json-no-force-pushes"
description = "Branch protection must disallow force pushes to the protected branch."
kind = "json-path-equals"
target = ".github/branch-protection.json"
pointer = "allow_force_pushes"
value = "false"

[[check]]
id = "branch-protection-json-no-deletions"
description = "Branch protection must disallow deletion of the protected branch."
kind = "json-path-equals"
target = ".github/branch-protection.json"
pointer = "allow_deletions"
value = "false"

[[check]]
id = "branch-protection-json-enforce-admins"
description = "Branch protection must not enforce the rules against admins."
kind = "json-path-equals"
target = ".github/branch-protection.json"
pointer = "enforce_admins"
value = "false"

# ======== rust-entry-config ========
[[check]]
id = "cli-main-foundation-entry-attr"
description = "The CLI main fn carries the foundation entry attribute (#[foundation_main])."
kind = "rust-fn-has-attr"
target = "crates/cli/src/main.rs"
function = "main"
attr = "foundation_main"
when_crates_contains = "cli"

[[check]]
id = "cli-config-derives-merge-config"
description = "The CLI Config struct derives MergeConfig."
kind = "rust-struct-has-derive"
target = "crates/cli/src/config.rs"
struct_name = "Config"
derive = "MergeConfig"
when_crates_contains = "cli"

[[check]]
id = "cli-config-merge-config-helper-attr"
description = "The CLI Config struct carries the merge_config helper attribute."
kind = "rust-struct-has-helper-attr"
target = "crates/cli/src/config.rs"
struct_name = "Config"
attr = "merge_config"
when_crates_contains = "cli"

[[check]]
id = "cli-config-common-field-count"
description = "The CLI Config struct has two fields marked #[merge_config(common)]."
kind = "rust-struct-field-attr-count"
target = "crates/cli/src/config.rs"
struct_name = "Config"
attr = "merge_config"
contains = "common"
count = 2
when_crates_contains = "cli"

[[check]]
id = "server-main-foundation-entry-attr"
description = "The server main fn carries the foundation entry attribute (#[foundation_main])."
kind = "rust-fn-has-attr"
target = "crates/server/src/main.rs"
function = "main"
attr = "foundation_main"
when_crates_contains = "server"

[[check]]
id = "server-main-delegates-to-foundation-runner"
description = "The server main fn delegates to the foundation runner via with_state and listen."
kind = "rust-method-chain"
target = "crates/server/src/main.rs"
function = "main"
methods = "with_state, listen"
when_crates_contains = "server"

[[check]]
id = "server-config-derives-merge-config"
description = "The server Config struct derives MergeConfig."
kind = "rust-struct-has-derive"
target = "crates/server/src/config.rs"
struct_name = "Config"
derive = "MergeConfig"
when_crates_contains = "server"

[[check]]
id = "server-config-merge-config-helper-attr"
description = "The server Config struct carries the merge_config helper attribute."
kind = "rust-struct-has-helper-attr"
target = "crates/server/src/config.rs"
struct_name = "Config"
attr = "merge_config"
when_crates_contains = "server"

[[check]]
id = "server-config-common-field-count"
description = "The server Config struct has two fields marked #[merge_config(common)]."
kind = "rust-struct-field-attr-count"
target = "crates/server/src/config.rs"
struct_name = "Config"
attr = "merge_config"
contains = "common"
count = 2
when_crates_contains = "server"

# The server crate embeds its compiled frontend into the binary via
# rust_embed, so a release binary is self-contained rather than depending on a
# frontend directory shipped alongside it.  A genuinely headless server (no
# frontend) opts out of these via compliance-ignores.
[[check]]
id = "server-build-script-present"
description = "The server crate keeps a build script that resolves the embedded-frontend asset directory."
kind = "file-present"
path = "crates/server/build.rs"
when_crates_contains = "server"

[[check]]
id = "server-frontend-module-present"
description = "The server crate declares its embedded frontend in a dedicated frontend.rs module."
kind = "file-present"
path = "crates/server/src/frontend.rs"
when_crates_contains = "server"

[[check]]
id = "server-frontend-derives-rust-embed"
description = "The server Frontend struct derives RustEmbed so its assets are embedded into the binary."
kind = "rust-struct-has-derive"
target = "crates/server/src/frontend.rs"
struct_name = "Frontend"
derive = "RustEmbed"
when_crates_contains = "server"

[[check]]
id = "server-main-installs-spa"
description = "The server main fn installs the embedded frontend via the SPA fallback (.spa)."
kind = "rust-method-chain"
target = "crates/server/src/main.rs"
function = "main"
methods = "spa"
when_crates_contains = "server"

[[check]]
id = "server-rust-embed-interpolate-feature"
description = "The workspace rust-embed dependency enables interpolate-folder-path so the frontend #[folder] can expand $RUST_TEMPLATE_FRONTEND_DIR."
kind = "toml-seq-contains"
target = "Cargo.toml"
pointer = "workspace.dependencies.rust-embed.features"
value = "interpolate-folder-path"
when_crates_contains = "server"

# ======== rust-modules ========
[[check]]
id = "lib-no-main"
description = "The lib crate is a library and must not have a binary entrypoint at crates/lib/src/main.rs."
kind = "file-absent"
path = "crates/lib/src/main.rs"

