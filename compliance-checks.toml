# Compliance checks for spawned repositories.
#
# Each [[check]] has a stable `id` (printed on failure), a human `description`,
# a `kind` from the finite set the engine implements, and that kind's
# parameters.  An optional `when_crates_contains` restricts a check to spawns
# whose crate-role list contains the given substring.  A spawn may opt out of
# any check by listing its id under `compliance-ignores` in its
# rust-template.json.
#
# Paths in `target` / `path` are relative to a spawn's project root.  See
# crates/compliance-lib for the kinds and docs/compliance.org for how this
# checker fits the broader compliance process.

# ── Required files ───────────────────────────────────────────────────

[[check]]
id = "required-file-changelog"
description = "The project keeps a CHANGELOG.org."
kind = "file-present"
path = "CHANGELOG.org"

[[check]]
id = "required-file-tasks"
description = "The project keeps a tasks.org backlog."
kind = "file-present"
path = "tasks.org"

[[check]]
id = "required-file-envrc"
description = "The project ships a .envrc for direnv/devshell activation."
kind = "file-present"
path = ".envrc"

[[check]]
id = "required-file-rustfmt"
description = "The workspace rustfmt.toml is present."
kind = "file-present"
path = "rustfmt.toml"

[[check]]
id = "required-file-cargo-toml"
description = "The workspace Cargo.toml is present."
kind = "file-present"
path = "Cargo.toml"

[[check]]
id = "required-file-flake-nix"
description = "The project provides a Nix flake."
kind = "file-present"
path = "flake.nix"

[[check]]
id = "required-file-flake-lock"
description = "The Nix flake lock is committed."
kind = "file-present"
path = "flake.lock"

[[check]]
id = "required-file-ci-workflow"
description = "The project has a CI workflow."
kind = "file-present"
path = ".github/workflows/ci.yml"

# ── Provenance ───────────────────────────────────────────────────────

[[check]]
id = "provenance-present"
description = "The rust-template.json provenance file is present."
kind = "file-present"
path = "rust-template.json"

[[check]]
id = "provenance-valid-json"
description = "The rust-template.json provenance file parses as JSON."
kind = "json-valid"
path = "rust-template.json"

# ── Foundation wiring ────────────────────────────────────────────────

[[check]]
id = "foundation-dependency-present"
description = "The workspace Cargo.toml depends on rust-template-foundation."
kind = "file-contains"
target = "Cargo.toml"
contains = "rust-template-foundation"

[[check]]
id = "ci-uses-reusable-workflows"
description = "CI calls the reusable workflows from rust-template."
kind = "file-contains"
target = ".github/workflows/ci.yml"
contains = "LoganBarnett/rust-template/"

[[check]]
id = "flake-foundation-input"
description = "The flake references rust-template as its foundation input."
kind = "file-contains"
target = "flake.nix"
contains = "LoganBarnett/rust-template"

[[check]]
id = "server-foundation-auth-feature"
description = "A server-crate spawn enables the foundation \"auth\" feature."
kind = "foundation-feature"
feature = "auth"
when_crates_contains = "server"

[[check]]
id = "cli-foundation-cli-feature"
description = "A cli-crate spawn enables the foundation \"cli\" feature."
kind = "foundation-feature"
feature = "cli"
when_crates_contains = "cli"

# ── Hygiene ──────────────────────────────────────────────────────────

[[check]]
id = "no-stale-rust-template-literals"
description = "No stale rust-template literals remain (foundation refs and the GitHub URL are allowed)."
kind = "no-stale-literal"

# ── Documentation (llms.org) ─────────────────────────────────────────

[[check]]
id = "llms-template-compliance-section"
description = "llms.org carries the \"Template compliance\" section."
kind = "section-exists"
target = "llms.org"
section = "Template compliance"

[[check]]
id = "llms-template-compliance-points-to-canonical-docs"
description = "The Template compliance section points to the canonical docs/compliance.org."
kind = "mention-present"
target = "llms.org"
section = "Template compliance"
contains = "docs/compliance.org"

[[check]]
id = "llms-persistent-memory-section"
description = "llms.org carries the \"Persistent memory\" section."
kind = "section-exists"
target = "llms.org"
section = "Persistent memory"

[[check]]
id = "llms-capturing-plans-section"
description = "llms.org carries the \"Capturing plans\" section."
kind = "section-exists"
target = "llms.org"
section = "Capturing plans"

# ── Foundation pin agreement ─────────────────────────────────────────

[[check]]
id = "foundation-pins-agree"
description = "The Cargo.lock and flake.lock foundation revisions agree with each other."
kind = "pins-agree"

[[check]]
id = "foundation-pins-current"
description = "Both foundation pins match the current rust-template HEAD."
kind = "pins-current"

# ── New checks (workflow machinery, foundation main/config, server
#    delegation, doc sections, workspace inheritance, ...) ──────────
# ======== github-yaml ========
# ---------------------------------------------------------------------------
# CI workflow (.github/workflows/ci.yml) — always emitted.
# ---------------------------------------------------------------------------

[[check]]
id = "ci-workflow-uses-reusable"
description = "The ci job must delegate to the rust-template reusable-ci workflow."
kind = "yaml-path-equals"
target = ".github/workflows/ci.yml"
pointer = "jobs.ci.uses"
value = "LoganBarnett/rust-template/.github/workflows/reusable-ci.yml@main"

[[check]]
id = "ci-workflow-push-main"
description = "CI must trigger on pushes to the main branch."
kind = "yaml-seq-contains"
target = ".github/workflows/ci.yml"
pointer = "on.push.branches"
value = "main"

[[check]]
id = "ci-workflow-pull-request-main"
description = "CI must trigger on pull requests targeting the main branch."
kind = "yaml-seq-contains"
target = ".github/workflows/ci.yml"
pointer = "on.pull_request.branches"
value = "main"

# ---------------------------------------------------------------------------
# Publish workflow (.github/workflows/publish.yml) — removed from PRIVATE
# spawns, so every check is gated with when_public = true.
# ---------------------------------------------------------------------------

[[check]]
id = "publish-workflow-present"
description = "The publish workflow file must exist in public spawns."
kind = "file-present"
path = ".github/workflows/publish.yml"
when_public = true

[[check]]
id = "publish-workflow-uses-reusable"
description = "The publish job must delegate to the rust-template reusable-publish workflow."
kind = "yaml-path-equals"
target = ".github/workflows/publish.yml"
pointer = "jobs.publish.uses"
value = "LoganBarnett/rust-template/.github/workflows/reusable-publish.yml@main"
when_public = true

[[check]]
id = "publish-workflow-push-main"
description = "Publish must trigger on pushes to the main branch."
kind = "yaml-seq-contains"
target = ".github/workflows/publish.yml"
pointer = "on.push.branches"
value = "main"
when_public = true

[[check]]
id = "publish-workflow-workflow-dispatch"
description = "Publish must be dispatchable so dependabot-automerge can fire it after a merge."
kind = "yaml-path-exists"
target = ".github/workflows/publish.yml"
pointer = "on.workflow_dispatch"
when_public = true

[[check]]
id = "publish-workflow-contents-write"
description = "Publish must grant contents: write at the workflow level."
kind = "yaml-path-equals"
target = ".github/workflows/publish.yml"
pointer = "permissions.contents"
value = "write"
when_public = true

[[check]]
id = "publish-workflow-id-token-write"
description = "Publish must grant id-token: write so the reusable workflow can mint the crates.io OIDC token."
kind = "yaml-path-equals"
target = ".github/workflows/publish.yml"
pointer = "permissions.id-token"
value = "write"
when_public = true

# ---------------------------------------------------------------------------
# Branch-protection workflow (.github/workflows/branch-protection.yml) —
# always emitted.
# ---------------------------------------------------------------------------

[[check]]
id = "branch-protection-workflow-present"
description = "The branch-protection workflow file must exist."
kind = "file-present"
path = ".github/workflows/branch-protection.yml"

[[check]]
id = "branch-protection-workflow-uses-reusable"
description = "The apply job must delegate to the rust-template reusable-branch-protection workflow."
kind = "yaml-path-equals"
target = ".github/workflows/branch-protection.yml"
pointer = "jobs.apply.uses"
value = "LoganBarnett/rust-template/.github/workflows/reusable-branch-protection.yml@main"

[[check]]
id = "branch-protection-workflow-push-main"
description = "The branch-protection workflow must trigger on pushes to the main branch."
kind = "yaml-seq-contains"
target = ".github/workflows/branch-protection.yml"
pointer = "on.push.branches"
value = "main"

# ---------------------------------------------------------------------------
# Dependabot auto-merge workflow (.github/workflows/dependabot-automerge.yml)
# — always emitted.
# ---------------------------------------------------------------------------

[[check]]
id = "dependabot-automerge-workflow-present"
description = "The dependabot auto-merge workflow file must exist."
kind = "file-present"
path = ".github/workflows/dependabot-automerge.yml"

[[check]]
id = "dependabot-automerge-uses-reusable"
description = "The automerge job must delegate to the rust-template reusable-dependabot-automerge workflow."
kind = "yaml-path-equals"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "jobs.automerge.uses"
value = "LoganBarnett/rust-template/.github/workflows/reusable-dependabot-automerge.yml@main"

[[check]]
id = "dependabot-automerge-workflow-run-ci"
description = "Auto-merge must listen for completion of the CI workflow via workflow_run."
kind = "yaml-seq-contains"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "on.workflow_run.workflows"
value = "CI"

[[check]]
id = "dependabot-automerge-workflow-run-completed"
description = "Auto-merge must fire on the completed type of the workflow_run event."
kind = "yaml-seq-contains"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "on.workflow_run.types"
value = "completed"

[[check]]
id = "dependabot-automerge-if-guards-pull-request"
description = "The automerge job must guard on the upstream run having been a pull_request event."
kind = "yaml-path-contains"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "jobs.automerge.if"
contains = "github.event.workflow_run.event == 'pull_request'"

[[check]]
id = "dependabot-automerge-if-guards-success"
description = "The automerge job must guard on the upstream CI run having succeeded."
kind = "yaml-path-contains"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "jobs.automerge.if"
contains = "github.event.workflow_run.conclusion == 'success'"

[[check]]
id = "dependabot-automerge-contents-write"
description = "Auto-merge must grant contents: write to push the changelog commit after the squash-merge."
kind = "yaml-path-equals"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "permissions.contents"
value = "write"

[[check]]
id = "dependabot-automerge-pull-requests-write"
description = "Auto-merge must grant pull-requests: write to perform the merge."
kind = "yaml-path-equals"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "permissions.pull-requests"
value = "write"

[[check]]
id = "dependabot-automerge-actions-write"
description = "Auto-merge must grant actions: write to dispatch the publish workflow after merge."
kind = "yaml-path-equals"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "permissions.actions"
value = "write"

# ---------------------------------------------------------------------------
# Dependabot config (.github/dependabot.yml) — always emitted.
# ---------------------------------------------------------------------------

[[check]]
id = "dependabot-config-present"
description = "The dependabot configuration file must exist."
kind = "file-present"
path = ".github/dependabot.yml"

[[check]]
id = "dependabot-config-version"
description = "The dependabot config must declare config version 2."
kind = "yaml-path-equals"
target = ".github/dependabot.yml"
pointer = "version"
value = "2"

[[check]]
id = "dependabot-config-cargo-ecosystem"
description = "Dependabot must update the cargo ecosystem."
kind = "yaml-path-equals"
target = ".github/dependabot.yml"
pointer = "updates.0.package-ecosystem"
value = "cargo"

[[check]]
id = "dependabot-config-github-actions-ecosystem"
description = "Dependabot must update the github-actions ecosystem."
kind = "yaml-path-equals"
target = ".github/dependabot.yml"
pointer = "updates.1.package-ecosystem"
value = "github-actions"

# ---------------------------------------------------------------------------
# Branch-protection rules (.github/branch-protection.json) — always emitted.
# ---------------------------------------------------------------------------

[[check]]
id = "branch-protection-json-present"
description = "The branch-protection rules file must exist."
kind = "file-present"
path = ".github/branch-protection.json"

[[check]]
id = "branch-protection-json-valid"
description = "The branch-protection rules file must be valid JSON."
kind = "json-valid"
path = ".github/branch-protection.json"

[[check]]
id = "branch-protection-json-strict-status-checks"
description = "Branch protection must require strict (up-to-date) status checks."
kind = "json-path-equals"
target = ".github/branch-protection.json"
pointer = "required_status_checks.strict"
value = "true"

[[check]]
id = "branch-protection-json-context-test"
description = "Branch protection must require the 'ci / Test' status check."
kind = "json-seq-contains"
target = ".github/branch-protection.json"
pointer = "required_status_checks.contexts"
value = "ci / Test"

[[check]]
id = "branch-protection-json-context-formatting"
description = "Branch protection must require the 'ci / Formatting' status check."
kind = "json-seq-contains"
target = ".github/branch-protection.json"
pointer = "required_status_checks.contexts"
value = "ci / Formatting"

[[check]]
id = "branch-protection-json-no-force-pushes"
description = "Branch protection must disallow force pushes to the protected branch."
kind = "json-path-equals"
target = ".github/branch-protection.json"
pointer = "allow_force_pushes"
value = "false"

[[check]]
id = "branch-protection-json-no-deletions"
description = "Branch protection must disallow deletion of the protected branch."
kind = "json-path-equals"
target = ".github/branch-protection.json"
pointer = "allow_deletions"
value = "false"

[[check]]
id = "branch-protection-json-enforce-admins"
description = "Branch protection must not enforce the rules against admins."
kind = "json-path-equals"
target = ".github/branch-protection.json"
pointer = "enforce_admins"
value = "false"

# ======== rust-entry-config ========
[[check]]
