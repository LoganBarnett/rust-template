# Both devShells export a RUST_TEMPLATE_SHELL marker naming which shell they
# are.  These checks evaluate the flake (rather than matching text) to confirm
# each shell resolves and carries its marker: the `default` shell, and the `ci`
# shell that foundation's mkCiShell builds and the reusable CI workflow enters
# via `nix develop .#ci`.  They require the spawn's foundation input to resolve,
# so the emission tests run them against a spawn localized to the template under
# test.
[[check]]
id = "flake-default-devshell-marker"
description = "The default devShell evaluates and exports RUST_TEMPLATE_SHELL=default."
kind = "dev-shell-env"
var = "RUST_TEMPLATE_SHELL"
value = "default"

[[check]]
id = "flake-ci-devshell-marker"
description = "The `ci` devShell (foundation's mkCiShell) evaluates and exports RUST_TEMPLATE_SHELL=ci, so the reusable CI workflow's `nix develop .#ci` resolves."
kind = "dev-shell-env"
shell = "ci"
var = "RUST_TEMPLATE_SHELL"
value = "ci"

# The default devShell must provide the load-bearing tools spawns and CI drive
# by name.  Evaluating the resolved shell's inputs rather than matching text
# means only a tool actually pulled into the shell satisfies the check; a spawn
# that drops one from its devShell is flagged even if the name lingers in a
# comment.
[[check]]
id = "dev-shell-provides-just"
description = "The default devShell provides just, the runner every recipe (including CI's) invokes."
kind = "dev-shell-package"
package = "just"

[[check]]
id = "dev-shell-provides-changelog-roller"
description = "The default devShell provides changelog-roller, which the changelog and abi CI jobs invoke."
kind = "dev-shell-package"
package = "changelog-roller"

[[check]]
id = "dev-shell-provides-cargo-semver-checks"
description = "The default devShell provides cargo-semver-checks, which the abi check invokes to detect public-API breaks."
kind = "dev-shell-package"
package = "cargo-semver-checks"

# ── Code-review gate (.claude) ───────────────────────────────────────
# We emit some Claude settings to help ensure our LLM and contributing
# guidelines are obeyed.

[[check]]
id = "review-gate-settings"
description = "The project ships .claude/settings.json registering the review Stop hook."
kind = "file-present"
path = ".claude/settings.json"

[[check]]
id = "review-gate-settings-wires-hook"
description = "The .claude/settings.json Stop hook invokes review-stop.sh."
kind = "file-contains"
target = ".claude/settings.json"
contains = "review-stop.sh"

# A separate concern that happens to live in the same file: the emitted
# settings disable Claude Code's auto-memory, so conventions are codified in
# the repo (llms.org, CONTRIBUTING.org, docs) rather than accrued as
# machine-local memory that drifts and is invisible to other contributors.
[[check]]
id = "settings-disables-auto-memory"
description = "The .claude/settings.json disables Claude Code auto-memory so conventions live in the repo rather than machine-local memory."
kind = "file-contains"
target = ".claude/settings.json"
contains = '"autoMemoryEnabled": false'

###
# Review Gate.
#
# The review gate is for LLM coding agents (as of 2026-08-19, only tested
# against Claude Code) to perform a review once a conversation turn is
# complete.  Helps prevent guessing and high confidence "I did it right" kind of
# assertions.
###
[[check]]
id = "review-gate-hook"
description = "The project ships the review-stop.sh Stop hook."
kind = "file-present"
path = ".claude/hooks/review-stop.sh"

[[check]]
