target = ".claude/hooks/review-stop.sh"
contains = "rust-template-review-stop"

[[check]]
id = "dev-shell-provides-review-stop"
description = "Make the review-stop binary available through the devShell."
kind = "dev-shell-package"
package = "rust-template-review-stop"

[[check]]
id = "review-gate-agent"
description = "The project ships the template-compliance review subagent."
