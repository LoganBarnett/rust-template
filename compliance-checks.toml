# Paired with the llms-imports-* checks above: those push a spawn to import
# CONTRIBUTING.org into the assistant's context, and the importer reads a line
# that begins with `@` as an import path — which is what makes an unguarded
# at-rule at the start of a line in this file's CSS examples resolve as one.  A
# spawn must gain the guard along with the imports, not after them.

# Both examples are asserted separately, distinguished by the selector after
# the at-rule.  A single check on the guard prefix would pass a file that
# guarded one example and left the other bare, and one unguarded at-rule is
# enough to reintroduce the hazard.

[[check]]
id = "contributing-css-dark-mode-good-example-guarded"
description = "The good light/dark CSS example guards its at-rule with a leading empty comment so the assistant's importer does not read the line-initial @ as an import path."
kind = "mention-present"
target = "CONTRIBUTING.org"
section = ["CSS", "Light and dark mode"]
contains = "/**/@media (prefers-color-scheme: dark) { :root {"

[[check]]
id = "contributing-css-dark-mode-bad-example-guarded"
description = "The bad light/dark CSS example guards its at-rule too, since the importer does not care that the example is the discouraged one."
kind = "mention-present"
target = "CONTRIBUTING.org"
section = ["CSS", "Light and dark mode"]
contains = "/**/@media (prefers-color-scheme: dark) { body {"

# The guard is meaningless without the paragraph that names it as an artifact
# of this file rather than a style rule.  A spawn that keeps the guard and
# drops the explanation would teach readers to write `/**/@media` in real
# stylesheets, so the closing instruction is asserted alongside the guard.

[[check]]
id = "contributing-css-dark-mode-guard-explained"
description = "CONTRIBUTING.org explains the /**/ at-rule guard as an import-path artifact and tells readers to write the at-rule bare in real stylesheets."
kind = "mention-present"
target = "CONTRIBUTING.org"
section = ["CSS", "Light and dark mode"]
contains = "Write the at-rule bare in real stylesheets"

