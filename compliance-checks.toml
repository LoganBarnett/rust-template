[[check]]
id = "flake-default-devshell"
description = "The flake exposes a default devShell."
kind = "file-contains"
target = "flake.nix"
contains = "devShells"

# Both devShells export a RUST_TEMPLATE_SHELL marker naming which shell they
# are.  These checks evaluate the flake (rather than matching text) to confirm
# each shell resolves and carries its marker: the `default` shell, and the `ci`
# shell that foundation's mkCiShell builds and the reusable CI workflow enters
# via `nix develop .#ci`.  They require the spawn's foundation input to resolve,
# so the emission tests run them against a spawn localized to the template under
# test.
[[check]]
id = "flake-default-devshell-marker"
description = "The default devShell evaluates and exports RUST_TEMPLATE_SHELL=default."
kind = "dev-shell-env"
var = "RUST_TEMPLATE_SHELL"
value = "default"

[[check]]
id = "flake-ci-devshell-marker"
description = "The `ci` devShell (foundation's mkCiShell) evaluates and exports RUST_TEMPLATE_SHELL=ci, so the reusable CI workflow's `nix develop .#ci` resolves."
kind = "dev-shell-env"
shell = "ci"
var = "RUST_TEMPLATE_SHELL"
value = "ci"

# ── Code-review gate (.claude) ───────────────────────────────────────
# Every spawned project ships a deterministic review gate: a Stop hook
# that blocks a turn from ending while un-reviewed code/config changes
# exist, until the template-compliance subagent reports COMPLIANCE: PASS.
# These checks assert the gate is present and that the hook and the agent
# still agree on the COMPLIANCE: marker that wires them together.

[[check]]
id = "review-gate-settings"
description = "The project ships .claude/settings.json registering the review Stop hook."
kind = "file-present"
path = ".claude/settings.json"

[[check]]
id = "review-gate-settings-wires-hook"
description = "The .claude/settings.json Stop hook invokes review-stop.sh."
kind = "file-contains"
target = ".claude/settings.json"
contains = "review-stop.sh"

[[check]]
id = "review-gate-hook"
description = "The project ships the review-stop.sh Stop hook."
kind = "file-present"
path = ".claude/hooks/review-stop.sh"

[[check]]
id = "review-gate-hook-reads-marker"
description = "The review-stop.sh hook gates on the COMPLIANCE: marker."
kind = "file-contains"
target = ".claude/hooks/review-stop.sh"
contains = "COMPLIANCE:"

[[check]]
id = "review-gate-hook-matches-agent-tool"
description = "The review-stop.sh hook detects the review whether the subagent tool is recorded as Task or Agent."
kind = "file-contains"
target = ".claude/hooks/review-stop.sh"
contains = 'or .name == "Agent"'

[[check]]
id = "review-gate-agent"
description = "The project ships the template-compliance review subagent."
kind = "file-present"
path = ".claude/agents/template-compliance.md"

[[check]]
id = "review-gate-agent-emits-marker"
description = "The template-compliance agent emits the COMPLIANCE: PASS verdict the hook reads."
kind = "file-contains"
target = ".claude/agents/template-compliance.md"
contains = "COMPLIANCE: PASS"
