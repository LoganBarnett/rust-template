when_crates_contains = "server"

# ---------------------------------------------------------------------------
# llms.org: major headings a spawn must keep.
# ---------------------------------------------------------------------------
[[check]]
id = "llms-server-role-section"
description = "llms.org documents the server crate's role and scope."
kind = "section-exists"
target = "llms.org"
section = "Server crate: role and scope"

[[check]]
id = "llms-general-code-guidelines-section"
description = "llms.org documents the general code guidelines."
kind = "section-exists"
target = "llms.org"
section = "General code guidelines"

[[check]]
id = "llms-verification-section"
description = "llms.org documents the verification workflow."
kind = "section-exists"
target = "llms.org"
section = "Verification"

# ---------------------------------------------------------------------------
# CONTRIBUTING.org: file plus major headings a spawn must keep.
# ---------------------------------------------------------------------------
[[check]]
id = "contributing-present"
description = "CONTRIBUTING.org is present in the spawn."
kind = "file-present"
path = "CONTRIBUTING.org"

[[check]]
id = "contributing-code-style-section"
description = "CONTRIBUTING.org documents code style."
kind = "section-exists"
target = "CONTRIBUTING.org"
section = "Code style"

[[check]]
id = "contributing-error-handling-section"
description = "CONTRIBUTING.org documents error handling."
kind = "section-exists"
target = "CONTRIBUTING.org"
section = "Error handling"

[[check]]
id = "contributing-css-section"
description = "CONTRIBUTING.org documents CSS conventions."
kind = "section-exists"
target = "CONTRIBUTING.org"
section = "CSS"

[[check]]
id = "contributing-systemd-secrets-section"
description = "CONTRIBUTING.org documents systemd secrets handling."
kind = "section-exists"
target = "CONTRIBUTING.org"
section = "Systemd secrets"

[[check]]
id = "contributing-logging-levels-section"
description = "CONTRIBUTING.org documents logging levels."
kind = "section-exists"
target = "CONTRIBUTING.org"
section = "Logging levels"

[[check]]
id = "contributing-changelog-conventions-section"
description = "CONTRIBUTING.org documents changelog conventions."
kind = "section-exists"
target = "CONTRIBUTING.org"
section = "Changelog conventions"

[[check]]
id = "flake-default-devshell"
description = "The flake exposes a default devShell."
kind = "file-contains"
target = "flake.nix"
contains = "devShells"
