contains = "Everything else is in scope."

[[check]]
id = "contributing-review-stop-section"
description = "CONTRIBUTING.org carries the \"Code-review Stop hook\" section explaining the gate binary and its PATH requirement."
kind = "section-exists"
target = "CONTRIBUTING.org"
section = ["Code-review Stop hook"]

[[check]]
id = "contributing-review-stop-names-binary"
description = "The Code-review Stop hook section names the rust-template-review-stop binary the hook execs."
