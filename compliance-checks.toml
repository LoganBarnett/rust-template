# Compliance checks for spawned repositories.
#
# Each [[check]] has a stable `id` (printed on failure), a human `description`,
# a `kind` from the finite set the engine implements, and that kind's
# parameters.  An optional `when_crates_contains` restricts a check to spawns
# whose crate-role list contains the given substring.  A spawn may opt out of
# any check by listing its id under `compliance-ignores` in its
# rust-template.json.
#
# Paths in `target` / `path` are relative to a spawn's project root; `suite`
# (template-suite-passes) is relative to the template checkout, since that
# kind runs the template's own suite against the spawn.  See
# crates/compliance-lib for the kinds and docs/compliance.org for how this
# checker fits the broader compliance process.

# ── Required files ───────────────────────────────────────────────────

# The next two back the import mechanism, whose failures are all silent.
# CLAUDE.md is the entry point Claude Code discovers, and llms.org — the
# document every llms-* check below asserts — reaches the assistant only
# through it.  A missing CLAUDE.md, a dangling link, a link at some other file,
# or a hand-written CLAUDE.md all disable the imports while llms.org itself
# still passes every content check.  So the link is asserted as a link: it must
# be a symlink resolving to llms.org.  With the chain proven here, nothing
# else needs to read llms.org through CLAUDE.md — every content check targets
# llms.org directly.  Likewise an import whose path does not resolve is
# dropped rather than reported, so a spawn that lost its README would keep
# passing while the agent quietly stopped receiving it.

[[check]]
id = "claude-md-symlinks-to-llms"
description = "CLAUDE.md is a symlink to llms.org, so the entry point the assistant discovers is the document the llms-* checks assert."
kind = "symlink-points-to"
path = "CLAUDE.md"
points_to = "llms.org"

[[check]]
id = "required-file-readme"
description = "The project keeps a README.org, which llms.org imports."
kind = "file-present"
path = "README.org"

[[check]]
id = "required-file-changelog"
description = "The project keeps a CHANGELOG.org."
kind = "file-present"
path = "CHANGELOG.org"

[[check]]
id = "required-file-tasks"
description = "The project keeps a tasks.org backlog."
kind = "file-present"
path = "tasks.org"

[[check]]
id = "required-file-envrc"
description = "The project ships a .envrc for direnv/devshell activation."
kind = "file-present"
path = ".envrc"

[[check]]
id = "required-file-rustfmt"
description = "The workspace rustfmt.toml is present."
kind = "file-present"
path = "rustfmt.toml"

[[check]]
id = "required-file-cargo-toml"
description = "The workspace Cargo.toml is present."
kind = "file-present"
path = "Cargo.toml"

[[check]]
id = "required-file-flake-nix"
description = "The project provides a Nix flake."
kind = "file-present"
path = "flake.nix"

[[check]]
id = "required-file-flake-lock"
description = "The Nix flake lock is committed."
kind = "file-present"
path = "flake.lock"

[[check]]
id = "required-file-ci-workflow"
description = "The project has a CI workflow."
kind = "file-present"
path = ".github/workflows/ci.yml"

# ── Provenance ───────────────────────────────────────────────────────

[[check]]
id = "provenance-present"
description = "The rust-template.json provenance file is present."
kind = "file-present"
path = "rust-template.json"

[[check]]
id = "provenance-valid-json"
description = "The rust-template.json provenance file parses as JSON."
kind = "json-valid"
path = "rust-template.json"

# ── Foundation wiring ────────────────────────────────────────────────

[[check]]
id = "foundation-dependency-present"
description = "The workspace Cargo.toml depends on rust-template-foundation."
kind = "toml-path-exists"
target = "Cargo.toml"
pointer = "workspace.dependencies.rust-template-foundation"

[[check]]
id = "ci-uses-reusable-workflows"
description = "CI calls the reusable workflows from rust-template."
kind = "file-contains"
target = ".github/workflows/ci.yml"
# The owner is omitted so a fork's spawns (which call their own
# fork/rust-template reusable workflows) pass too; only the repo name and the
# reusable-workflow path are fixed.  See tasks.org for full fork support.
contains = "rust-template/"

[[check]]
id = "flake-foundation-input"
description = "The flake references rust-template as its foundation input."
kind = "file-contains"
target = "flake.nix"
# Match the bare project name rather than the GitHub URL: a spawn normally
# points its foundation input at github:LoganBarnett/rust-template, but a test
# (or a local-development checkout) may point it at a file:// path to an
# on-disk rust-template instead.  Both spell "rust-template" in the input URL,
# and that string appears nowhere else in a spawn's flake.nix.
contains = "rust-template"

# The macOS cross-compiled package output (`<crate>-aarch64-darwin`), built on
# x86_64-linux via zig so no macOS runner is needed.  Evaluating it rather than
# matching text proves the mkDarwinCrossPackages wiring resolves, not merely
# that a call producing it appears in flake.nix.  The flake gates the darwin
# outputs to x86_64-linux, so this evaluates that system's package set
# explicitly; the crate prefix varies per spawn, so it matches by name suffix.
[[check]]
id = "flake-darwin-cross-wired"
description = "The flake exposes an aarch64 macOS cross-compiled package output that resolves, proving the mkDarwinCrossPackages wiring is present."
kind = "flake-output-present"
output = "packages"
system = "x86_64-linux"
suffix = "-aarch64-darwin"

# The flake carries the flag-driven Apple-SDK wiring (appleSdk taken from
# foundation.lib.pkgsUnfreeFor when apple-frameworks is set), so a spawn whose
# flake predates that wiring — and would therefore silently drop the SDK even
# with the flag on — is flagged for a sync.  Ungated: the wiring is emitted
# unconditionally (the flag only decides the value at eval), so every current
# spawn carries it regardless of whether it links frameworks.  The companion
# json check above guards the flag itself.
[[check]]
id = "flake-wires-apple-sdk"
description = "The flake carries the foundation.lib.pkgsUnfreeFor Apple-SDK wiring so a framework-linking spawn's darwin cross-build receives the SDK."
kind = "file-contains"
target = "flake.nix"
contains = "pkgsUnfreeFor"

# Enabling foundation's `auth` feature *forces* Apple-framework linking (its
# rustls-native-certs / platform-verifier stack links the Security,
# SystemConfiguration, and CoreFoundation frameworks), so an auth spawn whose
# darwin cross-build has no Apple SDK fails at link on the missing frameworks.
# The emitted flake wires `appleSdk` (via foundation.lib.pkgsUnfreeFor) only
# when `apple-frameworks` is true, so an auth spawn must set that flag.  It is
# gated on the feature via `when_foundation_feature`: a spawn that runs a
# server without auth links no frameworks, so the check skips rather than
# demanding an SDK it does not need.
[[check]]
id = "auth-spawn-wires-apple-frameworks"
description = "An auth-enabled spawn sets apple-frameworks=true in rust-template.json so its darwin cross-build links the Apple frameworks the auth TLS stack requires."
kind = "json-path-equals"
target = "rust-template.json"
pointer = "apple-frameworks"
value = "true"
when_foundation_feature = "auth"

# The always-on Windows cross build, the mirror of the darwin check above.
# Unlike darwin (which only runs on x86_64-linux), the Windows helper is
# host-agnostic — it cross-compiles native Windows PEs via llvm-mingw for the
# gnullvm targets on any host — so its `<crate>-{x86_64,aarch64}-windows`
# outputs resolve on whatever system the checker runs on.  These evaluate the
# flake rather than grepping it: a passing check proves the packages actually
# resolve (which also forces the whole package set — including the opt-in MSVC
# merge — to evaluate), not merely that a call producing them appears in the
# text.  The crate prefix varies per spawn, so they match by name suffix.  See
# the "Windows binaries" section of CONTRIBUTING.org.
[[check]]
id = "flake-windows-x86-package"
description = "The flake exposes an x86_64 native-Windows (gnullvm) package output that resolves."
kind = "flake-output-present"
output = "packages"
suffix = "-x86_64-windows"

[[check]]
id = "flake-windows-aarch64-package"
description = "The flake exposes an aarch64 native-Windows (gnullvm) package output that resolves."
kind = "flake-output-present"
output = "packages"
suffix = "-aarch64-windows"

# The wine smoke check that proves the x86_64 Windows binary executes, not just
# links.  The flake gates it to x86_64-linux (wine cannot exec an aarch64 PE),
# so this evaluates the x86_64-linux checks set explicitly — its presence
# resolves from any host even though the derivation only builds there.
[[check]]
id = "flake-windows-smoke-check"
description = "The flake exposes the windowsSmoke check on x86_64-linux so the x86_64 Windows binary is run under wine, not merely linked."
kind = "flake-output-present"
output = "checks"
system = "x86_64-linux"
attr = "windowsSmoke"

[[check]]
id = "server-foundation-auth-feature"
description = "A server-crate spawn enables the foundation \"auth\" feature."
kind = "foundation-feature"
feature = "auth"
when_crates_contains = "server"

[[check]]
id = "cli-foundation-cli-feature"
description = "A cli-crate spawn enables the foundation \"cli\" feature."
kind = "foundation-feature"
feature = "cli"
when_crates_contains = "cli"

# ── Hygiene ──────────────────────────────────────────────────────────

[[check]]
id = "no-stale-rust-template-literals"
description = "No stale rust-template literals remain (foundation refs and the GitHub URL are allowed)."
kind = "no-stale-literal"

# ── Documentation (llms.org) ─────────────────────────────────────────

[[check]]
id = "llms-template-compliance-section"
description = "llms.org carries the \"Template compliance\" section."
kind = "section-exists"
target = "llms.org"
section = ["Template compliance"]

[[check]]
id = "llms-template-compliance-points-to-canonical-docs"
description = "The Template compliance section points to the canonical docs/compliance.org."
kind = "mention-present"
target = "llms.org"
section = ["Template compliance"]
contains = "docs/compliance.org"

[[check]]
id = "llms-persistent-memory-section"
description = "llms.org carries the \"Persistent memory\" section."
kind = "section-exists"
target = "llms.org"
section = ["Persistent memory"]

[[check]]
id = "llms-capturing-plans-section"
description = "llms.org carries the \"Capturing plans\" section."
kind = "section-exists"
target = "llms.org"
section = ["Capturing plans"]

[[check]]
id = "llms-capturing-plans-flips-todo-in-pr"
description = "The Capturing plans section states that completing a TODO flips it to DONE in the same PR."
kind = "mention-present"
target = "llms.org"
section = ["Capturing plans"]
contains = "in the same change set that does the work"

# The "Imports" heading is a dedicated container for the Claude Code @path
# import lines, which is what makes the list assertable against a named scope
# rather than a position in the file.  No rule about where the section sits is
# needed — position is irrelevant to the mechanism, since an import is honored
# wherever it appears.

[[check]]
id = "llms-imports-section"
description = "llms.org carries the \"Imports\" section holding the documents every change is measured against."
kind = "section-exists"
target = "llms.org"
section = ["Imports"]

# The next two assert the import lines themselves, not prose describing them.
# A link or a "read this first" sentence is an invitation the agent may
# decline; an import puts the document in context before the first turn, which
# is the whole convention.
#
# They are deliberately not org-aware.  The importer matches whole lines — a
# line that is exactly `@<file>` — and anything looser, however valid as org,
# is not an import to it.  So this is one of the rare places where the AST is
# the wrong tool: a mention-present would pass an indented path, a path with
# trailing text, or a path inside a sentence, all of which the importer never
# sees.  line-present asserts the raw line instead.  Placement and order are
# the org-level questions, and llms-imports-ordered below asks those.

[[check]]
id = "llms-imports-readme"
description = "llms.org has a line that is exactly `@README.org`, the form the importer matches, so the agent carries README.org from the first turn."
kind = "line-present"
target = "llms.org"
line = "@README.org"

[[check]]
id = "llms-imports-contributing"
description = "llms.org has a line that is exactly `@CONTRIBUTING.org`, the form the importer matches, so the agent carries CONTRIBUTING.org from the first turn."
kind = "line-present"
target = "llms.org"
line = "@CONTRIBUTING.org"

# The org-level half.  Each import must be a paragraph of its own — a blank
# line before and after — because two imports on adjacent lines are one org
# paragraph, which is how org-fmt reads them and reflows them.  And the order
# is part of the convention: README.org (what the project is) frames
# everything after it, so it precedes CONTRIBUTING.org (how to land a change).
# The entries are an ordered subsequence of the section's paragraphs, not its
# exact contents, so a project may add its own imports around them.

[[check]]
id = "llms-imports-ordered"
description = "The Imports section carries `@README.org` and then `@CONTRIBUTING.org`, each as a paragraph of its own, in that order."
kind = "paragraphs-in-order"
target = "llms.org"
section = ["Imports"]
paragraphs = ["@README.org", "@CONTRIBUTING.org"]

# Each imported document's authority is pinned, not just its import line.  An
# import that arrives with no stated standing is one the agent can read and
# still disregard, which is the failure the imports exist to prevent.

[[check]]
id = "llms-imports-covers-landing"
description = "The Working with imports section states that CONTRIBUTING.org covers how to land a change."
kind = "mention-present"
target = "llms.org"
section = ["Working with imports"]
contains = "covers how to land a change"

[[check]]
id = "llms-imports-readme-authority"
description = "The Working with imports section states that a change contradicting README.org is wrong even when it compiles."
kind = "mention-present"
target = "llms.org"
section = ["Working with imports"]
contains = "wrong even when it compiles"

[[check]]
id = "llms-imports-editing-rules-section"
description = "llms.org carries the rules for editing the import list."
kind = "section-exists"
target = "llms.org"
section = ["Working with imports", "Rules for editing the import list"]

# The heading alone is not the convention, so the rule it carries is asserted
# as a phrase.  A spawn that keeps the heading and guts the body would
# otherwise pass while losing the rule.

[[check]]
id = "llms-imports-no-link-downgrade"
description = "The editing rules state that an import must not be downgraded to an org link."
kind = "mention-present"
target = "llms.org"
section = ["Working with imports", "Rules for editing the import list"]
contains = "invitation the agent may decline"

# The two shape rules llms-imports-ordered enforces — own paragraph, and
# relative order — are also stated where the agent will read them, so a
# failing check is a rule it has already seen rather than one it must
# reverse-engineer from the failure.  One phrase check per rule.

[[check]]
id = "llms-imports-own-paragraph-rule"
description = "The editing rules state that each import is a paragraph of its own, with a blank line before and after."
kind = "mention-present"
target = "llms.org"
section = ["Working with imports", "Rules for editing the import list"]
contains = "Each import is a paragraph of its own"

[[check]]
id = "llms-imports-order-rule"
description = "The editing rules state that README.org and CONTRIBUTING.org keep their relative order in the import list."
kind = "mention-present"
target = "llms.org"
section = ["Working with imports", "Rules for editing the import list"]
contains = "the two keep their relative order"

# ── Foundation pin agreement ─────────────────────────────────────────

[[check]]
id = "foundation-pins-agree"
description = "The Cargo.lock and flake.lock foundation revisions agree with each other."
kind = "pins-agree"

[[check]]
id = "foundation-pins-current"
description = "Both foundation pins match the current rust-template HEAD."
kind = "pins-current"

# ── New checks (workflow machinery, foundation main/config, server
#    delegation, doc sections, workspace inheritance, ...) ──────────
# ======== github-yaml ========
# ---------------------------------------------------------------------------
# CI workflow (.github/workflows/ci.yml) — always emitted.
# ---------------------------------------------------------------------------

[[check]]
id = "ci-workflow-uses-reusable"
description = "The ci job must delegate to the rust-template reusable-ci workflow."
kind = "yaml-path-contains"
target = ".github/workflows/ci.yml"
pointer = "jobs.ci.uses"
# Owner-agnostic (a fork delegates to its own copy); the repo name and
# reusable-workflow path are still required.  See tasks.org for full fork
# support.
contains = "rust-template/.github/workflows/reusable-ci.yml@main"

[[check]]
id = "ci-workflow-push-main"
description = "CI must trigger on pushes to the main branch."
kind = "yaml-seq-contains"
target = ".github/workflows/ci.yml"
pointer = "on.push.branches"
value = "main"

[[check]]
id = "ci-workflow-pull-request-main"
description = "CI must trigger on pull requests targeting the main branch."
kind = "yaml-seq-contains"
target = ".github/workflows/ci.yml"
pointer = "on.pull_request.branches"
value = "main"

[[check]]
id = "ci-workflow-workflow-dispatch"
description = "CI must be dispatchable so dependabot-automerge can re-run the required checks against the changelog commit."
kind = "yaml-path-exists"
target = ".github/workflows/ci.yml"
pointer = "on.workflow_dispatch"

# ---------------------------------------------------------------------------
# Publish workflow (.github/workflows/publish.yml) — emitted in every spawn,
# public or private.  Whether it publishes to crates.io is governed by each
# crate's publish destination list, so these checks run unconditionally.
# ---------------------------------------------------------------------------

[[check]]
id = "publish-workflow-present"
description = "The publish workflow file must exist in every spawn."
kind = "file-present"
path = ".github/workflows/publish.yml"

[[check]]
id = "publish-workflow-uses-reusable"
description = "The publish job must delegate to the rust-template reusable-publish workflow."
kind = "yaml-path-contains"
target = ".github/workflows/publish.yml"
pointer = "jobs.publish.uses"
contains = "rust-template/.github/workflows/reusable-publish.yml@main"

[[check]]
id = "publish-workflow-push-main"
description = "Publish must trigger on pushes to the main branch."
kind = "yaml-seq-contains"
target = ".github/workflows/publish.yml"
pointer = "on.push.branches"
value = "main"

[[check]]
id = "publish-workflow-workflow-dispatch"
description = "Publish must be dispatchable so dependabot-automerge can fire it after a merge."
kind = "yaml-path-exists"
target = ".github/workflows/publish.yml"
pointer = "on.workflow_dispatch"

[[check]]
id = "publish-workflow-contents-write"
description = "Publish must grant contents: write at the workflow level."
kind = "yaml-path-equals"
target = ".github/workflows/publish.yml"
pointer = "permissions.contents"
value = "write"

[[check]]
id = "publish-workflow-id-token-write"
description = "Publish must grant id-token: write so the reusable workflow can mint the crates.io OIDC token."
kind = "yaml-path-equals"
target = ".github/workflows/publish.yml"
pointer = "permissions.id-token"
value = "write"

# ---------------------------------------------------------------------------
# Release-binaries workflow (.github/workflows/release-binaries.yml) — emitted
# in every spawn, dispatched by the publish run after it tags a release.
# Whether it produces any artifact is governed by each crate's release-binary
# flag in rust-template.json, so its presence is checked unconditionally.
# ---------------------------------------------------------------------------

[[check]]
id = "release-binaries-workflow-present"
description = "The release-binaries workflow file must exist in every spawn."
kind = "file-present"
path = ".github/workflows/release-binaries.yml"

[[check]]
id = "release-binaries-workflow-uses-reusable"
description = "The release-binaries job must delegate to the rust-template reusable workflow."
kind = "yaml-path-contains"
target = ".github/workflows/release-binaries.yml"
pointer = "jobs.release-binaries.uses"
contains = "rust-template/.github/workflows/reusable-release-binaries.yml@main"

[[check]]
id = "release-binaries-workflow-dispatch"
description = "Release-binaries must be dispatchable so the publish run can fire it after tagging."
kind = "yaml-path-exists"
target = ".github/workflows/release-binaries.yml"
pointer = "on.workflow_dispatch"

[[check]]
id = "release-binaries-workflow-id-token-write"
description = "Release-binaries must grant id-token: write so the build can mint the Sigstore signing token for build-provenance attestation."
kind = "yaml-path-equals"
target = ".github/workflows/release-binaries.yml"
pointer = "permissions.id-token"
value = "write"

[[check]]
id = "release-binaries-workflow-attestations-write"
description = "Release-binaries must grant attestations: write so the build can record build-provenance attestations for each artifact."
kind = "yaml-path-equals"
target = ".github/workflows/release-binaries.yml"
pointer = "permissions.attestations"
value = "write"

# ---------------------------------------------------------------------------
# Branch-protection workflow (.github/workflows/branch-protection.yml) —
# always emitted.
# ---------------------------------------------------------------------------

[[check]]
id = "branch-protection-workflow-present"
description = "The branch-protection workflow file must exist."
kind = "file-present"
path = ".github/workflows/branch-protection.yml"

[[check]]
id = "branch-protection-workflow-uses-reusable"
description = "The apply job must delegate to the rust-template reusable-branch-protection workflow."
kind = "yaml-path-contains"
target = ".github/workflows/branch-protection.yml"
pointer = "jobs.apply.uses"
contains = "rust-template/.github/workflows/reusable-branch-protection.yml@main"

[[check]]
id = "branch-protection-workflow-push-main"
description = "The branch-protection workflow must trigger on pushes to the main branch."
kind = "yaml-seq-contains"
target = ".github/workflows/branch-protection.yml"
pointer = "on.push.branches"
value = "main"

# ---------------------------------------------------------------------------
# Dependabot auto-merge workflow (.github/workflows/dependabot-automerge.yml)
# — always emitted.
#
# The compliance surface stops at this wrapper and its @main delegation to
# rust-template's reusable-dependabot-automerge workflow (asserted just below).
# Everything that reusable workflow pulls in — the setup-nix action, and the
# dependabot-allowlist composite action with its allowlist.sh predicate — is
# referenced by @main and lives only in rust-template; it is never emitted into
# a spawn, so no per-spawn file-present check applies to it (the same reason
# setup-nix has none).  The allowlist predicate's own correctness is instead
# guarded by test-dependabot-allowlist.sh in this repo's CI.
# ---------------------------------------------------------------------------

[[check]]
id = "dependabot-automerge-workflow-present"
description = "The dependabot auto-merge workflow file must exist."
kind = "file-present"
path = ".github/workflows/dependabot-automerge.yml"

[[check]]
id = "dependabot-automerge-uses-reusable"
description = "The automerge job must delegate to the rust-template reusable-dependabot-automerge workflow."
kind = "yaml-path-contains"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "jobs.automerge.uses"
contains = "rust-template/.github/workflows/reusable-dependabot-automerge.yml@main"

[[check]]
id = "dependabot-automerge-workflow-run-ci"
description = "Auto-merge must listen for completion of the CI workflow via workflow_run."
kind = "yaml-seq-contains"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "on.workflow_run.workflows"
value = "CI"

[[check]]
id = "dependabot-automerge-workflow-run-completed"
description = "Auto-merge must fire on the completed type of the workflow_run event."
kind = "yaml-seq-contains"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "on.workflow_run.types"
value = "completed"

# The event/conclusion gate now lives on the reusable workflow's own job
# (consumed via @main), so the wrapper no longer carries an `if` — and this
# check forces an older spawn still holding the superseded guard to re-sync and
# drop it, since that guard would filter out the changelog re-dispatch pass and
# wedge the two-pass flow.  It forbids only the exact superseded condition, so a
# spawn that sets its own unrelated `if` (or none) is unaffected.
[[check]]
id = "dependabot-automerge-no-legacy-if"
description = "The automerge wrapper must not carry the superseded inline event/conclusion guard the reusable workflow now owns (a spawn still holding it filters out the changelog re-dispatch pass); a spawn's own unrelated guard is unaffected."
kind = "yaml-path-not-contains"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "jobs.automerge.if"
contains = "github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'"

[[check]]
id = "dependabot-automerge-contents-write"
description = "Auto-merge must grant contents: write to push the changelog commit after the squash-merge."
kind = "yaml-path-equals"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "permissions.contents"
value = "write"

[[check]]
id = "dependabot-automerge-pull-requests-write"
description = "Auto-merge must grant pull-requests: write to perform the merge."
kind = "yaml-path-equals"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "permissions.pull-requests"
value = "write"

[[check]]
id = "dependabot-automerge-actions-write"
description = "Auto-merge must grant actions: write to re-dispatch CI and dispatch the publish workflow."
kind = "yaml-path-equals"
target = ".github/workflows/dependabot-automerge.yml"
pointer = "permissions.actions"
value = "write"

# ---------------------------------------------------------------------------
# Dependabot backlog combiner — a one-shot `just dependabot-combine` that
# bundles the passing open Dependabot PRs into one PR and merges it, for
# clearing a backlog the per-PR auto-merge did not.  The tool is a package on
# the rust-template (foundation) flake, not a per-spawn copy, so these checks
# assert the spawn wires that package into its dev shell and exposes the recipe
# — nothing is emitted to check for presence.
# ---------------------------------------------------------------------------

[[check]]
id = "dependabot-combine-flake-includes-package"
description = "The spawn's flake must pull the combiner package from the foundation flake into its dev shell."
kind = "dev-shell-package"
package = "dependabot-combine"

[[check]]
id = "dependabot-combine-justfile-recipe"
description = "The spawn's justfile must expose the combiner as the dependabot-combine recipe."
kind = "justfile-recipe"
recipe = "dependabot-combine"

# ---------------------------------------------------------------------------
# Dependency bump (.github/workflows/dependency-bump.yml) — always emitted.
#
# The daily scheduled `cargo update` flow that replaces Dependabot.  The
# compliance surface stops at this wrapper and its @main delegation to
# rust-template's reusable-dependency-bump workflow; the bump engine itself is
# the `dependency-bump` package on the foundation flake (wired below), never
# emitted into a spawn.  Only the schedule's presence is asserted, not its
# timing — spawns are invited to re-stagger the cron.
# ---------------------------------------------------------------------------

[[check]]
id = "dependency-bump-workflow-present"
description = "The dependency-bump workflow file must exist."
kind = "file-present"
path = ".github/workflows/dependency-bump.yml"

[[check]]
id = "dependency-bump-uses-reusable"
description = "The bump job must delegate to the rust-template reusable-dependency-bump workflow."
kind = "yaml-path-contains"
target = ".github/workflows/dependency-bump.yml"
pointer = "jobs.bump.uses"
contains = "rust-template/.github/workflows/reusable-dependency-bump.yml@main"

[[check]]
id = "dependency-bump-schedule-trigger"
description = "The bump must run on a cron schedule (any timing suits; only presence is asserted)."
kind = "yaml-path-exists"
target = ".github/workflows/dependency-bump.yml"
pointer = "on.schedule.0.cron"

[[check]]
id = "dependency-bump-dispatch-trigger"
description = "The bump must be manually runnable via workflow_dispatch for catch-up runs."
kind = "yaml-path-exists"
target = ".github/workflows/dependency-bump.yml"
pointer = "on.workflow_dispatch"

[[check]]
id = "dependency-bump-contents-write"
description = "The bump must grant contents: write to push the bump branch and its commit."
kind = "yaml-path-equals"
target = ".github/workflows/dependency-bump.yml"
pointer = "permissions.contents"
value = "write"

[[check]]
id = "dependency-bump-pull-requests-write"
description = "The bump must grant pull-requests: write to open and merge the bump PR."
kind = "yaml-path-equals"
target = ".github/workflows/dependency-bump.yml"
pointer = "permissions.pull-requests"
value = "write"

[[check]]
id = "dependency-bump-actions-write"
description = "The bump must grant actions: write to dispatch CI, approve its gated run, and dispatch publish."
kind = "yaml-path-equals"
target = ".github/workflows/dependency-bump.yml"
pointer = "permissions.actions"
value = "write"

[[check]]
id = "dependency-bump-flake-includes-package"
description = "The spawn's flake must pull the bump tool package from the foundation flake into its dev shell."
kind = "dev-shell-package"
package = "dependency-bump"

[[check]]
id = "dependency-bump-justfile-recipe"
description = "The spawn's justfile must expose the bump tool as the dependency-bump recipe."
kind = "justfile-recipe"
recipe = "dependency-bump"

