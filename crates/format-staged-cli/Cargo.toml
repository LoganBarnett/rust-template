[package]
name = "rust-template-format-staged-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = []

[[bin]]
name = "rust-template-format-staged-cli"
path = "src/main.rs"

[dependencies]
# Supplies the staged-configuration derive and the entry point that parses the
# arguments, resolves the config file, and initialises logging.
rust-template-foundation = { workspace = true, features = ["cli"] }
# The engine that formats the staged content.  This crate is the front-end a
# pre-commit hook runs.
rust-template-format-staged-lib = { workspace = true }
# Parses the logging flags and their env-var fallbacks for the
# MergeConfig-derived Config.
clap = { workspace = true }
# Required in scope by the foundation_main-generated entry point for logging.
tracing = { workspace = true }
# Deserializes the staged config file for the MergeConfig-derived Config.
serde = { workspace = true }
# Wraps the engine's error in the front-end's own, so a failed run names what
# the hook was doing.
thiserror = { workspace = true }
# Enables method chaining and reduces superfluous local variables that only
# exist to name intermediate results.  Prefer .tap() over temporary variables
# when it improves readability.
tap = { workspace = true }

[dev-dependencies]
# Gives each integration case its own scratch git repository, so the binary
# never runs against the checkout under test.
tempfile = "3"

[lints]
workspace = true
