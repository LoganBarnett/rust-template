[package]
name = "rust-template-foundation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared infrastructure for projects spawned from rust-template."
publish = ["crates-io"]

[features]
default = []
cli = ["dep:clap", "dep:tracing-subscriber"]
server = [
    "dep:axum",
    "dep:tokio",
    "dep:tokio-listener",
    "dep:tower",
    "dep:tower-http",
    "dep:prometheus",
    "dep:aide",
    "dep:schemars",
    "dep:serde_json",
    "dep:sd-notify",
    "dep:tracing-subscriber",
    "dep:tracing-journald",
    "dep:rust-embed",
]
auth = [
    "server",
    "cli",
    "dep:openidconnect",
    "dep:reqwest",
    "dep:reqwest13",
    "dep:rustls",
    "dep:tower-sessions",
    "dep:axum-jwt-auth",
    "dep:jsonwebtoken",
]

[dependencies]
# Always present
rust-template-foundation-derive = { workspace = true }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1"
home = "0.5"

# CLI feature
clap = { version = "4.5", features = ["derive", "env"], optional = true }

# Server feature
axum = { version = "0.8", optional = true }
tokio = { version = "1.41", features = ["full"], optional = true }
tokio-listener = { version = "0.5", features = ["axum08"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = ["trace", "cors"], optional = true }
prometheus = { version = "0.14", optional = true }
aide = { version = "0.15", features = ["axum", "axum-json", "axum-query", "scalar", "macros"], optional = true }
schemars = { version = "1.2", optional = true }
serde_json = { version = "1.0", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"], optional = true }
# Frontend assets are embedded into the server binary so a downloaded
# release is self-contained.  rust-embed reads them from disk in debug
# builds and bakes them into the binary in release builds, so local
# development still picks up `elm make` output without a rebuild.  The
# `mime-guess` feature drives the Content-Type the SPA service returns.
rust-embed = { version = "8", features = ["mime-guess"], optional = true }

# Auth feature
openidconnect = { version = "3", features = ["reqwest"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
tower-sessions = { version = "0.15", features = ["memory-store"], optional = true }
# JWKS-backed JWT validation.  `default-features = false` disables its
# `rustls-tls` default, which forwards to reqwest 0.13's `rustls` feature and so
# turns on the aws-lc-rs rustls provider — a C library (aws-lc-sys) whose build
# panics under zig cross-compilation to darwin.  We instead drive its reqwest
# 0.13 TLS through the `reqwest13` dependency below (rustls-no-provider) so the
# shared rustls resolves to ring, matching our own reqwest above.
axum-jwt-auth = { version = "0.7", default-features = false, optional = true }
# axum-jwt-auth builds a reqwest 0.13 client internally to fetch JWKS.  We
# depend on reqwest 0.13 explicitly (renamed, since our own reqwest above is
# 0.12) only to select `rustls-no-provider`: reqwest 0.13 no longer offers a
# ring feature, so its sole non-aws-lc-rs path is to bundle no provider itself
# and defer to the process-wide default `build_decoder` registers (ring).
# `json` matches the feature axum-jwt-auth needs; both unify onto the one
# reqwest 0.13 build.
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "rustls-no-provider"], optional = true }
# Depended on directly so `build_decoder` can register ring as the process-wide
# rustls crypto provider (an in-memory default, not an on-disk install), which
# reqwest 0.13's `rustls-no-provider` path requires (it panics at client build
# otherwise).  `ring` also unifies onto the shared rustls, keeping aws-lc-rs out
# of the graph entirely.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
jsonwebtoken = { version = "10", optional = true }

# Unix-only server dependencies: systemd's journal logging
# (tracing-journald) and its readiness/watchdog protocol (sd-notify).  Both are
# Unix-only, so the server feature pulls them only on Unix; a Windows
# cross-build compiles neither and uses the stderr log path and the systemd
# no-op stubs (see src/server/systemd.rs) instead.
[target.'cfg(unix)'.dependencies]
tracing-journald = { version = "0.3", optional = true }
sd-notify = { version = "0.5", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.41", features = ["full"] }
tower = "0.5"
serde_json = "1.0"
openidconnect = { version = "3", features = ["reqwest"] }
http-body-util = "0.1"
axum = "0.8"
jsonwebtoken = "10"

# Integration tests that exercise the MergeConfig derive use the
# clap-driven CliRaw / ConfigFileRaw / Config pipeline, which is only
# compiled when the cli feature is enabled.  Declaring the required
# feature here makes cargo skip these tests with default features
# instead of failing the build with unresolved imports.
[[test]]
name = "extra_error_test"
required-features = ["cli"]

[[test]]
name = "subcommand_test"
required-features = ["cli"]

[lints]
workspace = true
