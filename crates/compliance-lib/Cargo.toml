[package]
name = "rust-template-compliance-lib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = []

[dependencies]
# Shared config-staging, logging, and error infrastructure the engine builds on.
rust-template-foundation = { workspace = true }
# Structured, level-based diagnostics emitted while running checks.
tracing = { workspace = true }
# Derives the typed models for config.json, rust-template.json, and the
# compliance-checks.toml manifest.
serde = { workspace = true }
# Semantic, per-operation error types for the engine.
thiserror = { workspace = true }
# Parses config.json, rust-template.json, and spawn flake.lock files, and
# derives the serializable report types for JSON output.
serde_json = { workspace = true }
# Parses the compliance-checks.toml manifest and spawn Cargo.lock files.
toml = { workspace = true }
# Parses org-mode documents for the section-exists and mention-present checks.
# The LoganBarnett/orgize fork is used deliberately: it is ahead of the
# crates.io release and is what the rest of the ecosystem (org-fmt) pins.  Used
# only by this crate, so it is a direct dependency rather than a workspace one.
orgize = { git = "https://github.com/LoganBarnett/orgize.git" }
# Parses GitHub Actions workflow YAML for the yaml-ast checks, navigating the
# value tree rather than scraping text.  yaml-rust2 is the maintained
# pure-Rust parser; its low-level value enum lets us match raw scalar keys.
yaml-rust2 = "0.11"
# Parses spawn Rust sources into an AST for the rust-ast checks, so they assert
# on resolved items/attributes/idents rather than scraping source text (the
# macro-expanded identifiers never appear pre-expansion).  `visit` powers the
# method-chain traversal.
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
# Enables method chaining and reduces superfluous local variables that only
# exist to name intermediate results.  Prefer .tap() over temporary variables
# when it improves readability.
tap = { workspace = true }

[dev-dependencies]
# Builds throwaway fixture spawn trees for the engine integration tests.
tempfile = "3"

[lints]
workspace = true
