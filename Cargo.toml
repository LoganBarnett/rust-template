[workspace]
resolver = "2"
members = [
    "crates/foundation-derive",
    "crates/foundation",
    "crates/compliance-lib",
    "crates/compliance-cli",
]

# Shared metadata for workspace members.  Each crate inherits these
# with `.workspace = true` so a release bumps the version in exactly
# one place — the linear minor-bump cadence assumes lockstep
# versioning across the workspace.  Fields that vary per crate
# (`name`, `description`, `publish`) stay declared on each member.
[workspace.package]
version = "0.19.0"
edition = "2021"
authors = ["Logan Barnett <logustus@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/LoganBarnett/rust-template"

# Inter-workspace deps live here so the reusable publish workflow can
# bump their version specifiers in lockstep with workspace.package.version
# by sed-ing every `version = "<x>"` literal on a line containing a
# `path = ` reference.  Members consume these as `{ workspace = true }`.
[workspace.dependencies]
# The foundation-derive proc-macro crate (MergeConfig, foundation_main).
rust-template-foundation-derive = { path = "crates/foundation-derive", version = "0.19.0" }
# Shared infrastructure (config staging, logging, CLI entry point) consumed by
# the compliance crates the same way a spawned project consumes it.
rust-template-foundation = { path = "crates/foundation", version = "0.19.0" }
# The compliance engine library, consumed by the compliance cli front-end.
rust-template-compliance-lib = { path = "crates/compliance-lib", version = "0.19.0" }

# External dependencies shared by the compliance crates.  Those crates were
# dogfooded from the template archetypes, which consume shared deps as
# `{ workspace = true }`; declaring them here keeps the archetype crate files
# unmodified.  Unlike the inter-workspace path deps above, these carry no
# `path =`, so the reusable publish workflow's version-bump sed leaves them
# alone.
# Structured, level-based diagnostics for the checker run.
tracing = "0.1"
# Deserializes config.json, rust-template.json, and the compliance-checks.toml
# manifest into typed structures.
serde = { version = "1.0", features = ["derive"] }
# Semantic, per-operation error types (no stringly-typed errors).
thiserror = "2.0"
# Method chaining that keeps logging/inspection inside a call chain instead of
# spawning intermediate locals.
tap = "1.0"
# Derive-based parsing of the compliance cli's arguments and env-var fallbacks.
clap = { version = "4.5", features = ["derive", "env"] }
# Parses config.json (spawn registry), rust-template.json (provenance), and
# spawn flake.lock files, and serializes the JSON report.  Shared by both
# compliance crates.
serde_json = "1.0"

# Project-wide lint policy, enforced via clippy.  Test code is exempted
# from the panicking-variant bans by clippy.toml's
# allow-unwrap-in-tests / allow-expect-in-tests / allow-panic-in-tests,
# which cover both #[cfg(test)] modules in src/ and integration tests
# under tests/.  Member crates opt in by setting [lints] workspace = true.
#
# `clippy::all` (the default groups: correctness, style, complexity,
# perf, suspicious) is denied so that any clippy warning fails the
# build, not just the panicking-variant bans.  Priority -1 is required
# whenever a lint group and individual lints from that group share a
# table — otherwise cargo errors with "lints contain duplicate".
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# ----------------------------------------------------------------------------
# Combinator preference: nudge toward the least powerful construct that
# fits.  These flag manual reimplementations of standard combinators —
# match-on-Option that could be Option::map, if-let-else that could be
# map_or, and so on.  See template/llms.org "Rule of least power" for
# the principle behind the set.  Mirrored from template/Cargo.toml so
# the rust-template repo holds itself to the same standards it ships.
#
# Configured at "warn" rather than "deny" because some imperative forms
# are genuinely clearer (multi-line bodies, side effects, nested control
# flow); humans can override site-locally with #[allow(...)] and a
# one-line reason.  Note: this downgrades the style/complexity lints
# from deny (via `all` above) to warn for this set specifically — same
# behavior as the template emits into spawned projects.
manual_map = "warn"
manual_filter = "warn"
manual_filter_map = "warn"
manual_find = "warn"
manual_find_map = "warn"
manual_flatten = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_unwrap_or = "warn"
manual_unwrap_or_default = "warn"
option_if_let_else = "warn"
map_unwrap_or = "warn"
needless_collect = "warn"
unnecessary_fold = "warn"
question_mark = "warn"
single_match_else = "warn"
collapsible_match = "warn"
redundant_pattern_matching = "warn"

# This workspace ships compliance-cli as a release artifact, so optimize the
# release profile for the end user rather than for build speed.  lto and a
# single codegen unit let the optimizer work across crate boundaries (faster
# runtime, smaller code), and strip removes symbols to shrink the download.
# opt-level stays at the default 3 — tuned for speed, not size.
[profile.release]
lto = true
codegen-units = 1
strip = true
