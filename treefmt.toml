# treefmt.toml — unified formatter configuration for the rust-template
# repo itself.  Mirrors template/treefmt.toml so files in template/ are
# formatted the same whether treefmt runs from this root or from inside
# a spawned project.  Run `treefmt` to format every tracked file, or
# `treefmt <path>` for a single file.  All formatter binaries are
# provided by the Nix devShell defined in flake.nix.

[formatter.rustfmt]
command = "rustfmt"
options = ["--edition", "2021"]
includes = ["*.rs"]

[formatter.alejandra]
command = "alejandra"
includes = ["*.nix"]

[formatter.elm-format]
command = "elm-format"
options = ["--yes"]
includes = ["*.elm"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.css"]

[formatter.org-fmt]
command = "org-fmt"
options = ["--in-place"]
includes = ["*.org"]
